<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#2B2A29">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="Terranova CRM">
<meta name="format-detection" content="telephone=no">
<title>Terranova Sales CRM</title>
<link rel="manifest" href="./manifest.json">
<link rel="icon" type="image/png" href="./icon-64.png">
<link rel="apple-touch-icon" href="./icon-192.png">
<link rel="stylesheet" href="./leaflet.css">
<script src="./supabase.min.js"></script>
<script src="./leaflet.js"></script>
<style>
/* ============ Terranova CRM — redesign tokens (per design handover) ============ */
@font-face{
  font-family:'Plus Jakarta Sans';
  src:url('./PlusJakartaSans.woff2') format('woff2-variations');
  font-weight:200 800;
  font-display:swap;
}
:root{
  --brand:#8CC63F; --brand-deep:#78B833; --brand-dark:#5C8F27;
  --charcoal:#2B2A29; --charcoal-deep:#18170F;
  --silver:#B2B3B3; --lightgrey:#D9DADA;
  --green:#5BA829; --amber:#E8A33D; --red:#D64541;
  --bg:#F5F6F1; --surface:#FFFFFF; --sunken:#ECEEE6; --border:#E2E4D9;
  --text:#221F1C; --text-2:#65675C; --text-3:#9A9C90;
  --radius-sm:8px; --radius-md:12px; --radius-lg:16px; --radius-xl:24px; --pill:999px;
  --sh-sm:0 1px 2px rgba(34,31,28,.08);
  --sh-md:0 6px 20px rgba(34,31,28,.10);
  --sh-lg:0 24px 56px rgba(34,31,28,.18);
  --glow:0 10px 28px rgba(140,198,63,.38);
  --font:'Plus Jakarta Sans',-apple-system,"Segoe UI",Arial,sans-serif;
}
@media(prefers-color-scheme:dark){
  :root{
    --bg:#161613; --surface:#201F1B; --sunken:#2A2925; --border:#34332D;
    --text:#F2F1EA; --text-2:#B8B9AC; --text-3:#7E8074;
    --lightgrey:#3A392F; --silver:#6E7064; --charcoal:#F2F1EA; --charcoal-deep:#0D0C08;
    --sh-sm:0 1px 2px rgba(0,0,0,.4); --sh-md:0 6px 20px rgba(0,0,0,.45); --sh-lg:0 24px 56px rgba(0,0,0,.6);
  }
  .kpi-ring,.slabcard{background:#0E0E0A !important}
  .kcard .mv.fwd{background:var(--brand);color:#161613}
  #toast{background:#F2F1EA;color:#161613}
  #toast.win{background:var(--brand-deep);color:#10130A}
  #toast.err{background:var(--red);color:#fff}
  nav{background:rgba(22,22,19,.92) !important}
  header{background:var(--surface)}
  .logo svg [fill="#2B2A29"],.logo svg [fill="#2b2a29"],
  #login .lgo svg [fill="#2B2A29"],#login .lgo svg [fill="#2b2a29"]{fill:#F2F1EA}
}
@media(prefers-color-scheme:light){
  .streak{color:#A9690E}
}
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
html{-webkit-text-size-adjust:100%}
html,body{height:100%}
body{font-family:var(--font);background:var(--bg);color:var(--text);font-size:15px;-webkit-font-smoothing:antialiased}
button{font:inherit;cursor:pointer;border:none;background:none;color:inherit}
button,input,select,a{transition:background .16s ease,color .16s ease,border-color .16s ease,box-shadow .16s ease,transform .16s ease,opacity .16s ease}
a{color:var(--brand-dark)} a:hover{color:var(--brand-deep)}
::-webkit-scrollbar{width:10px;height:10px}
::-webkit-scrollbar-thumb{background:var(--lightgrey);border-radius:999px}
.tnum{font-variant-numeric:tabular-nums}

@keyframes pulseDot{0%,100%{opacity:1;transform:scale(1)}50%{opacity:.45;transform:scale(.85)}}
@keyframes frameIn{from{opacity:0;transform:translateY(14px) scale(.985)}to{opacity:1;transform:translateY(0) scale(1)}}
@keyframes breathe{0%,100%{opacity:.28;transform:translateX(-50%) scale(1)}50%{opacity:.42;transform:translateX(-50%) scale(1.08)}}
@keyframes sparkTwinkle{0%,100%{opacity:.25;transform:scale(.7)}50%{opacity:.9;transform:scale(1.15)}}
@keyframes ringGrow{from{opacity:0;transform:scale(.8)}to{opacity:1;transform:scale(1)}}
@keyframes toastPop{from{opacity:0;transform:translate(-50%,10px) scale(.96)}to{opacity:1;transform:translate(-50%,0) scale(1)}}
@keyframes sheetUp{from{transform:translateY(30px);opacity:.4}to{transform:translateY(0);opacity:1}}

/* ---------- form primitives ---------- */
input,select,textarea{font:inherit;font-size:16px;color:var(--text);width:100%;min-height:46px;padding:0 13px;
  border:1.5px solid var(--border);border-radius:10px;background:var(--sunken);outline:none}
textarea{padding:10px 13px;min-height:70px}
input:focus,select:focus,textarea:focus{background:#fff;border-color:var(--brand-deep);box-shadow:0 0 0 3px rgba(140,198,63,.25)}
input:disabled,select:disabled{background:var(--border);color:var(--text-2);cursor:not-allowed}
label{display:flex;flex-direction:column;gap:5px;font-size:12.5px;font-weight:700;color:var(--text-2);margin-top:12px}
label .hint{font-weight:600;color:var(--text-3)}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:6px;min-height:44px;padding:0 16px;
  border-radius:10px;font-weight:800;font-size:13.5px}
.btn:active{transform:scale(.97);filter:brightness(.95)}
@media(hover:none){
  .btn-primary:hover{transform:none;box-shadow:var(--sh-sm)}
  .kpi:hover,.kcard:hover,.lift:hover{transform:none;box-shadow:var(--sh-sm)}
  .kpi-ring:hover{box-shadow:var(--sh-md)}
  #whoami:hover{background:none}
}
.btn-primary{background:linear-gradient(180deg,var(--brand),var(--brand-deep));color:var(--charcoal);box-shadow:var(--sh-sm)}
.btn-primary:hover{transform:translateY(-1px);box-shadow:var(--glow)}
.btn-ghost{background:var(--surface);border:1px solid var(--border);color:var(--text)}
.btn-ghost:hover{background:var(--sunken)}
.btn-plain{color:var(--text-2)}
.btn-danger{background:#fff;border:1px solid var(--red);color:var(--red)}
.btn-sm{min-height:36px;padding:0 13px;font-size:12.5px;border-radius:9px}
.chip{display:inline-block;padding:3px 8px;border-radius:var(--pill);font-size:10px;font-weight:800;letter-spacing:.05em}
.chip-brand{color:var(--brand-dark);background:rgba(140,198,63,.16)}
.badge{display:inline-block;padding:2px 7px;border-radius:6px;font-size:10.5px;font-weight:700;background:var(--sunken);color:var(--text)}
.badge-removed{background:rgba(214,69,65,.15);color:var(--red);border-radius:var(--pill);padding:3px 9px;font-weight:800}
.muted{color:var(--text-3)}.small{font-size:12.5px}
.card{background:var(--surface);border:1px solid var(--border);border-radius:var(--radius-lg);padding:16px;box-shadow:var(--sh-sm)}
.card h3{font-size:15px;font-weight:800;margin-bottom:4px}
.lift{transition:transform .18s ease,box-shadow .18s ease}
.lift:hover{transform:translateY(-2px);box-shadow:var(--sh-md)}
.hairline{height:1px;background:var(--border)}
.row{display:flex;align-items:center;gap:10px;padding:11px 0;border-top:1px solid var(--border)}
.row:first-of-type{border-top:none}
.eyebrow{font-size:10.5px;font-weight:800;letter-spacing:.06em;color:var(--text-3);text-transform:uppercase}
.viewwrap{animation:frameIn .5s cubic-bezier(.16,1,.3,1) both}
.pagehead{display:flex;align-items:flex-end;justify-content:space-between;gap:12px;margin-bottom:14px;flex-wrap:wrap}
.pagehead h2{font-size:20px;font-weight:800}
@media(min-width:768px){.pagehead h2{font-size:24px}}
.pagehead .sub{font-size:13px;color:var(--text-2)}

/* ---------- v2: FAB + quick actions ---------- */
#fab{position:fixed;right:16px;bottom:calc(84px + env(safe-area-inset-bottom));z-index:60;
  width:58px;height:58px;border-radius:50%;background:linear-gradient(180deg,var(--brand),var(--brand-deep));
  color:#1E2A0E;font-size:30px;font-weight:700;display:flex;align-items:center;justify-content:center;
  box-shadow:var(--glow);transition:transform .18s cubic-bezier(.16,1,.3,1)}
#fab:active{transform:scale(.92)}
@media(min-width:768px){#fab{display:none}}
.qsheet{display:flex;flex-direction:column;gap:6px;padding-top:4px}
.qact{display:flex;align-items:center;gap:14px;padding:13px 12px;border-radius:14px;font-size:15px;font-weight:700;
  background:var(--sunken);width:100%;text-align:left;transition:transform .15s ease}
.qact:active{transform:scale(.98)}
.qact .qi{width:40px;height:40px;border-radius:12px;display:flex;align-items:center;justify-content:center;
  font-size:19px;flex-shrink:0;background:linear-gradient(180deg,var(--brand),var(--brand-deep))}

/* ---------- v2: Today feed ---------- */
.hero{background:var(--charcoal);border-radius:20px;padding:20px;color:#fff;box-shadow:var(--sh-md);
  display:flex;align-items:center;gap:18px;position:relative;overflow:hidden}
@media(prefers-color-scheme:dark){.hero{background:#0E0E0A}}
.hero .glowbg{position:absolute;top:-60px;right:-40px;width:180px;height:180px;border-radius:50%;
  background:var(--brand);filter:blur(80px);opacity:.25}
.hero .eyebrow{color:#C7CBB8}
.hero .bignum{font-size:30px;font-weight:800;font-variant-numeric:tabular-nums;color:#fff}
.hero .sub{font-size:12.5px;color:#B6BBA6;margin-top:2px}
.streak{display:inline-flex;align-items:center;gap:5px;font-size:11.5px;font-weight:800;color:#FFD08A;
  background:rgba(232,163,61,.18);padding:4px 10px;border-radius:var(--pill);margin-top:8px}
.greet{font-size:22px;font-weight:800;letter-spacing:-.01em}
.greet-sub{font-size:13px;color:var(--text-2)}
.attn{border:1px solid rgba(214,69,65,.35);background:rgba(214,69,65,.06)}
.attn h3{color:var(--red)}
.attn .row{border-top-color:rgba(214,69,65,.15)}
.nudge{font-size:12px;font-weight:700;color:var(--red)}
.feedcta{display:flex;align-items:center;gap:12px;background:var(--surface);border:1.5px dashed var(--brand);
  border-radius:16px;padding:14px 16px;font-weight:700;width:100%;text-align:left}
.feedcta .qi{width:38px;height:38px;border-radius:11px;background:linear-gradient(180deg,var(--brand),var(--brand-deep));
  display:flex;align-items:center;justify-content:center;font-size:18px;flex-shrink:0}
.gg{font-size:11.5px;font-weight:700;color:var(--brand-dark)}

/* ---------- v2: stage pager (mobile pipeline) ---------- */
.stagechips{display:flex;gap:8px;overflow-x:auto;padding:2px 14px 10px;margin:0 -14px;-webkit-overflow-scrolling:touch;scrollbar-width:none}
.stagechips::-webkit-scrollbar{display:none}
.schip{flex-shrink:0;display:flex;flex-direction:column;align-items:flex-start;gap:1px;padding:9px 14px;border-radius:14px;
  background:var(--surface);border:1.5px solid var(--border);transition:transform .15s ease}
.schip:active{transform:scale(.96)}
.schip .sl{font-size:11px;font-weight:800;letter-spacing:.04em;color:var(--text-3);text-transform:uppercase;display:flex;align-items:center;gap:5px}
.schip .sdot{width:7px;height:7px;border-radius:50%}
.schip .sv{font-size:13px;font-weight:800;font-variant-numeric:tabular-nums}
.schip.on{border-color:var(--charcoal);background:var(--charcoal)}
.schip.on .sl,.schip.on .sv{color:#fff}
@media(prefers-color-scheme:dark){.schip.on{background:#F2F1EA;border-color:#F2F1EA}.schip.on .sl,.schip.on .sv{color:#161613}}
.stagelist{display:flex;flex-direction:column;gap:10px}

.kanban-area.kanban{display:block !important;overflow:visible;margin:0;padding:0;scroll-snap-type:none}
.kanban-area .only-desktop .kanban{display:grid;grid-template-columns:repeat(5,1fr);gap:12px;overflow:visible}
@media(max-width:899px){.kanban-area .only-desktop{display:none}}

/* ---------- v2: inline trail map ---------- */
.trailmap{height:230px;border-radius:14px;overflow:hidden;margin:8px 0 4px;border:1px solid var(--border);background:var(--sunken)}
.leaflet-container{font-family:var(--font)}
.tpin{display:flex;align-items:center;justify-content:center;width:26px;height:26px;border-radius:50%;
  background:linear-gradient(180deg,var(--brand),var(--brand-deep));color:#1E2A0E;font-weight:800;font-size:12px;
  border:2.5px solid #fff;box-shadow:0 2px 8px rgba(34,31,28,.35)}
.daychips{display:flex;gap:6px;overflow-x:auto;padding:2px 0 6px;scrollbar-width:none}
.daychips::-webkit-scrollbar{display:none}
.dchip{flex-shrink:0;font-size:11.5px;font-weight:800;padding:5px 11px;border-radius:var(--pill);
  background:var(--sunken);color:var(--text-2);border:1.5px solid transparent}
.dchip.on{background:var(--charcoal);color:#fff}
@media(prefers-color-scheme:dark){
  .dchip.on{background:#F2F1EA;color:#161613}
  .leaflet-tile{filter:brightness(.75) contrast(1.05) saturate(.85)}
  .trailmap{border-color:#34332D}
}
.leaflet-popup-content{font-size:12.5px;font-weight:600;margin:9px 12px}
.leaflet-popup-content a{font-weight:800}

/* ---------- v2: skeleton loading ---------- */
@keyframes shimmer{0%{background-position:-200px 0}100%{background-position:200px 0}}
.skel{border-radius:14px;background:linear-gradient(90deg,var(--sunken) 25%,var(--border) 50%,var(--sunken) 75%);
  background-size:400px 100%;animation:shimmer 1.2s infinite linear}

/* ---------- v2: pull to refresh hint ---------- */
#ptr{position:fixed;top:calc(env(safe-area-inset-top) + 8px);left:50%;transform:translateX(-50%) scale(0);z-index:80;
  width:34px;height:34px;border-radius:50%;background:var(--surface);box-shadow:var(--sh-md);
  display:flex;align-items:center;justify-content:center;transition:transform .2s ease;color:var(--brand-dark);font-weight:800}
#ptr.show{transform:translateX(-50%) scale(1)}

/* ---------- phone polish (≤430px) ---------- */
@media(max-width:430px){
  main{padding:14px 14px 100px}
  .card{padding:14px;border-radius:14px}
  .pagehead{margin-bottom:12px}
  .pagehead h2{font-size:22px}
  .hwrap{padding:12px 14px;gap:8px}
  .hwrap .chip{display:none}
  #logout{padding:0 10px}
  .kpis{gap:10px}
  .kpi{padding:14px}
  .kpi .val{font-size:clamp(20px,6.6vw,26px);letter-spacing:-.01em}
  .kpi-ring{padding:16px;gap:13px}
  .kanban{margin:0 -14px;padding-left:14px;padding-right:14px}
  .dashgrid{gap:12px}
  .mrow{grid-template-columns:1fr 1fr;gap:0 10px}
}
@media(max-width:360px){
  #whoami .r{display:none}
  .mrow{grid-template-columns:1fr}
  .kpi .val{font-size:20px}
}

/* ---------- login ---------- */
#login{min-height:100%;display:flex;flex-direction:column;align-items:center;justify-content:center;padding:28px;position:relative;overflow:hidden;
  background:radial-gradient(120% 90% at 50% -10%,#2E3B1C 0%,var(--charcoal-deep) 55%,#0F0E09 100%)}
#login .glow{position:absolute;top:-40px;left:50%;width:260px;height:260px;border-radius:50%;background:var(--brand);filter:blur(70px);animation:breathe 5s ease-in-out infinite}
#login .rings{position:absolute;top:38px;left:50%;transform:translateX(-50%);opacity:.14;pointer-events:none}
#login .card{position:relative;width:100%;max-width:380px;border:none;border-radius:20px;box-shadow:var(--sh-lg);padding:32px 26px;
  animation:frameIn .6s .1s cubic-bezier(.16,1,.3,1) both}
#login .lgo svg{height:34px;width:auto;display:block}
#login .eyebrow{margin-top:10px;letter-spacing:.08em;font-size:12px}
#login .hairline{margin:16px 0}
#lbtn{width:100%;min-height:48px;margin-top:18px;box-shadow:var(--glow)}
#lbtn:hover{box-shadow:0 14px 32px rgba(140,198,63,.48)}
#loginerr{font-size:13px;font-weight:600;color:var(--red);margin-top:12px;min-height:18px}
#login .foot{position:relative;margin-top:26px;font-size:12px;color:#9BA394;text-align:center}

/* ---------- shell ---------- */
#app{display:none;min-height:100%}
header{position:sticky;top:0;z-index:40;background:var(--surface);border-bottom:1px solid var(--border)}
.hwrap{max-width:1280px;margin:0 auto;display:flex;align-items:center;gap:10px;padding:14px 18px}
@media(min-width:768px){.hwrap{padding:14px 32px}}
.hwrap .logo svg{height:20px;width:auto;display:block}
@media(min-width:768px){.hwrap .logo svg{height:24px}}
.hspace{flex:1}
#whoami{text-align:right;line-height:1.25}
#whoami .n{font-weight:700;font-size:13px}
#whoami .r{font-size:11px;color:var(--text-3)}
#statepick{width:auto;min-height:40px;padding:0 26px 0 12px;font-size:16px;font-weight:600;background:var(--surface);border:1px solid var(--border);border-radius:8px;max-width:44vw}
@media(min-width:768px){#statepick{font-size:13px;min-height:38px}}
#logout{min-height:34px;border:1px solid var(--border);background:var(--surface);border-radius:8px;padding:0 12px;font-size:12px;font-weight:700}
#bell{position:relative;min-height:34px;min-width:38px;display:flex;align-items:center;justify-content:center;border:1px solid var(--border);background:var(--surface);border-radius:8px;color:var(--text-2);cursor:pointer;-webkit-tap-highlight-color:transparent}
#bell.on{color:var(--brand-dark);border-color:var(--brand)}
#bellbadge{position:absolute;top:-5px;right:-5px;min-width:17px;height:17px;padding:0 4px;border-radius:999px;background:#E5484D;color:#fff;font-size:10px;font-weight:800;display:flex;align-items:center;justify-content:center;line-height:1;box-shadow:0 0 0 2px var(--surface)}
#bellbadge[hidden]{display:none}
#npanel{position:fixed;top:calc(58px + env(safe-area-inset-top,0px));right:10px;z-index:90;width:min(390px,calc(100vw - 20px));max-height:min(66vh,560px);overflow-y:auto;background:var(--surface);border:1px solid var(--border);border-radius:16px;box-shadow:var(--sh-lg);animation:frameIn .22s cubic-bezier(.16,1,.3,1) both}
.nphead{position:sticky;top:0;display:flex;align-items:center;justify-content:space-between;gap:8px;padding:13px 16px 10px;background:var(--surface);border-bottom:1px solid var(--border);font-size:15px;font-weight:800;z-index:1}
.nphead button{min-height:30px;border:none;background:none;color:var(--brand-dark);font-size:12px;font-weight:800;cursor:pointer;padding:0 4px}
.npush{display:flex;align-items:center;gap:10px;padding:11px 16px;border-bottom:1px solid var(--border);font-size:12px;color:var(--text-2)}
.npush .btn{min-height:34px;font-size:12px}
.nitem{display:flex;gap:10px;align-items:flex-start;padding:12px 16px;border-bottom:1px solid var(--border);cursor:pointer;-webkit-tap-highlight-color:transparent}
.nitem:last-child{border-bottom:none}
.nitem .nt{font-size:13.5px;font-weight:700;line-height:1.3}
.nitem .nb{font-size:12.5px;color:var(--text-2);margin-top:2px;line-height:1.35}
.nitem .nm{font-size:11px;color:var(--text-3);margin-top:3px}
.nitem .ndot{width:8px;height:8px;border-radius:50%;background:var(--brand);margin-top:6px;flex-shrink:0;opacity:0}
.nitem.unread{background:rgba(140,198,63,.08)}
.nitem.unread .ndot{opacity:1}
.nempty{padding:34px 16px;text-align:center;color:var(--text-3);font-size:13px}
@media(max-width:767px){#npanel{top:auto;bottom:calc(76px + env(safe-area-inset-bottom,0px));right:8px;max-height:62vh}}
.segpick{display:flex;gap:8px;margin:4px 0 12px}
.segbtn{flex:1;min-height:52px;border:1.5px solid var(--border);background:var(--surface);border-radius:12px;padding:8px 10px;font-size:12.5px;font-weight:800;color:var(--text-2);cursor:pointer;text-align:center;line-height:1.3;-webkit-tap-highlight-color:transparent}
.segbtn .s2{display:block;font-size:10.5px;font-weight:600;color:var(--text-3);margin-top:2px}
.segbtn.on{border-color:var(--brand);color:var(--brand-dark);background:rgba(140,198,63,.10)}
.custswitch{display:flex;gap:8px;margin:0 0 12px}
.cbtn{min-height:40px;border:1.5px solid var(--border);background:var(--surface);border-radius:999px;padding:0 16px;font-size:12.5px;font-weight:800;color:var(--text-2);cursor:pointer;-webkit-tap-highlight-color:transparent}
.cbtn.on{border-color:var(--brand);color:var(--brand-dark);background:rgba(140,198,63,.10)}
.qadd{margin:8px 0 4px;padding:12px;border:1.5px dashed var(--brand);border-radius:12px;background:rgba(140,198,63,.06)}
.qadd .eyebrow{margin-bottom:2px}
.srcchip{font-size:10px;font-weight:800;letter-spacing:.04em;color:var(--brand-dark);background:rgba(140,198,63,.14);padding:3px 8px;border-radius:999px}
nav{background:var(--surface)}
.nwrap{max-width:1280px;margin:0 auto;display:flex}
nav button{flex:1;display:flex;flex-direction:column;align-items:center;gap:3px;padding:9px 0 12px;
  font-size:10.5px;font-weight:700;color:var(--text-3);border-top:2px solid transparent}
nav button svg{width:20px;height:20px}
nav button.on{color:var(--brand-dark);border-top-color:var(--brand)}
main{max-width:1280px;margin:0 auto;padding:18px;padding-bottom:96px}
@media(min-width:768px){
  main{padding:28px 32px 48px}
  nav{border-bottom:1px solid var(--border)}
  nav button{flex:0 0 auto;flex-direction:row;gap:7px;font-size:14px;padding:12px 18px;border-top:none;border-bottom:2px solid transparent}
  nav button.on{border-bottom-color:var(--brand)}
}
@media(max-width:767px){
  nav{position:fixed;bottom:0;left:0;right:0;border-top:1px solid var(--border);
    padding-bottom:env(safe-area-inset-bottom);z-index:50;
    background:rgba(255,255,255,.92);-webkit-backdrop-filter:blur(14px);backdrop-filter:blur(14px)}
  nav button{padding:10px 0 12px;font-size:11px}
  nav button svg{width:22px;height:22px}
}

/* ---------- dashboard ---------- */
.kpis{display:flex;flex-wrap:wrap;gap:12px;margin-bottom:14px}
@media(min-width:900px){.kpis{gap:16px}}
.kpi{position:relative;overflow:hidden;flex:1 1 150px;background:var(--surface);border:1px solid var(--border);
  border-radius:var(--radius-lg);padding:16px;box-shadow:var(--sh-sm);transition:transform .18s ease,box-shadow .18s ease}
.kpi:hover{transform:translateY(-3px);box-shadow:var(--sh-md)}
@media(min-width:900px){.kpi{padding:20px}}
.kpi .accent{position:absolute;top:0;left:0;right:0;height:4px;background:var(--lightgrey)}
.kpi.live .accent{background:linear-gradient(90deg,var(--brand),var(--brand-deep))}
.kpi .val{font-size:26px;font-weight:800;margin-top:6px;font-variant-numeric:tabular-nums}
@media(min-width:900px){.kpi .val{font-size:32px;margin-top:8px}}
.kpi .sub{font-size:12px;color:var(--text-2);margin-top:2px}
.kpi-ring{flex:1 1 100%;display:flex;align-items:center;gap:16px;background:var(--charcoal);border:none;
  border-radius:18px;padding:18px;box-shadow:var(--sh-md);color:#fff}
.kpi-ring:hover{box-shadow:var(--sh-lg)}
@media(min-width:900px){.kpi-ring{flex:1 1 300px;border-radius:var(--radius-lg);padding:20px}}
.kpi-ring .eyebrow{color:#C7CBB8}
.kpi-ring .val{font-size:22px;color:#fff}
.kpi-ring .sub{color:#B6BBA6}
.kpi-ring svg{flex-shrink:0;animation:ringGrow .6s cubic-bezier(.16,1,.3,1) both}
.kpi-ring circle.arc{transition:stroke-dashoffset .9s cubic-bezier(.16,1,.3,1)}
.dashgrid{display:grid;gap:14px}
@media(min-width:900px){.dashgrid{grid-template-columns:1.3fr 1fr;gap:16px;align-items:start}}
.dot{width:11px;height:11px;border-radius:50%;flex-shrink:0;display:inline-block}
.d-g{background:var(--green);box-shadow:0 0 0 4px rgba(91,168,41,.13);animation:pulseDot 2s infinite}
.d-a{background:var(--amber);box-shadow:0 0 0 4px rgba(232,163,61,.13)}
.d-r{background:var(--red);box-shadow:0 0 0 4px rgba(214,69,65,.13)}

.fsrow{cursor:pointer}
.fsrow .chev{color:var(--text-3);font-size:11px;transition:transform .16s ease}
.fsrow.open .chev{transform:rotate(180deg)}
.maplink{display:inline-block;font-size:11.5px;font-weight:700;color:var(--brand-dark);background:rgba(140,198,63,.14);
  padding:3px 8px;border-radius:var(--pill);text-decoration:none;margin:2px 3px 2px 0;font-variant-numeric:tabular-nums}
.maplink:hover{background:rgba(140,198,63,.28);color:var(--brand-dark)}
.citime{display:inline-block;font-size:11.5px;font-weight:700;color:var(--text-2);background:var(--sunken);
  padding:3px 8px;border-radius:var(--pill);margin:2px 3px 2px 0;font-variant-numeric:tabular-nums}

/* ---------- pipeline ---------- */
.seg{display:inline-flex;background:var(--sunken);border-radius:9px;padding:3px;gap:2px}
.seg button{padding:7px 12px;border-radius:7px;font-size:12.5px;font-weight:700;color:var(--text-2)}
.seg button.on{background:var(--surface);color:var(--text);box-shadow:var(--sh-sm)}
.kanban{display:flex;gap:12px;overflow-x:auto;padding-bottom:8px;margin:0 -18px;padding-left:18px;padding-right:18px;
  -webkit-overflow-scrolling:touch;scroll-snap-type:x proximity;scroll-padding-left:14px}
@media(min-width:1024px){.kanban{display:grid;grid-template-columns:repeat(5,1fr);overflow:visible;margin:0;padding:0}}
.kcol{width:250px;flex-shrink:0;scroll-snap-align:start}
@media(max-width:430px){.kcol{width:min(258px,78vw)}}
@media(min-width:1024px){.kcol{width:auto}}
.kcolhead{border-top:4px solid var(--silver);background:var(--surface);border-radius:0 0 12px 12px;padding:10px 12px;
  display:flex;justify-content:space-between;box-shadow:var(--sh-sm);font-size:12px;font-weight:800;letter-spacing:.03em}
.kcolhead .sum{color:var(--text-3);font-variant-numeric:tabular-nums}
.kcolhead.has .sum{color:var(--text)}
.kc-lead .kcolhead{border-top-color:var(--silver)}
.kc-qualified .kcolhead{border-top-color:var(--amber)}
.kc-negotiation .kcolhead{border-top-color:var(--brand)}
.kc-won .kcolhead{border-top-color:var(--brand-deep);background:linear-gradient(135deg,var(--brand),var(--brand-deep));box-shadow:var(--glow);color:#fff}
.kc-won .kcolhead .sum{color:#fff}
.kc-lost .kcolhead{border-top-color:var(--red)}
.kcards{display:flex;flex-direction:column;gap:10px;margin-top:10px}
.kempty{padding:22px 8px;text-align:center;color:var(--text-3);font-size:13px;position:relative}
.kc-won .kempty{color:var(--brand-dark);font-weight:700;font-size:12.5px}
.spark{position:absolute;animation:sparkTwinkle 2.4s ease-in-out infinite}
.kcard{background:var(--surface);border:1px solid var(--border);border-left:4px solid var(--brand);border-radius:12px;
  padding:14px;box-shadow:var(--sh-sm);display:flex;flex-direction:column;gap:8px;cursor:pointer;
  transition:transform .18s ease,box-shadow .18s ease}
.kcard:hover{transform:translateY(-3px);box-shadow:var(--sh-md)}
.kcard .t{font-size:14px;font-weight:700;line-height:1.3}
.kcard .meta{display:flex;align-items:center;gap:6px;font-size:12px;color:var(--text-2);flex-wrap:wrap}
.kcard .na{font-size:12.5px;color:var(--brand-dark);font-weight:600}
.kcard .amtrow{display:flex;justify-content:space-between;align-items:baseline}
.kcard .amt{font-size:18px;font-weight:800;font-variant-numeric:tabular-nums}
.kcard .date{font-size:12px;color:var(--text-3)}
.kcard .foot{display:flex;justify-content:space-between;align-items:center}
.kcard .foot .owner{font-size:12px;font-weight:600;color:var(--text-2)}
.kcard .mv{width:30px;height:30px;border-radius:8px;font-weight:700;display:inline-flex;align-items:center;justify-content:center}
.kcard .mv.back{border:1px solid var(--border);background:var(--sunken)}
.kcard .mv.fwd{background:var(--charcoal);color:#fff}
.kcard .mv:disabled{opacity:.25;cursor:default}
.stage-lead{border-left-color:var(--silver)}.stage-qualified{border-left-color:var(--amber)}
.stage-negotiation{border-left-color:var(--brand)}.stage-won{border-left-color:var(--brand-deep)}.stage-lost{border-left-color:var(--red)}

/* ---------- my day ---------- */
.actions{display:flex;gap:8px;flex-wrap:wrap}
@media(max-width:430px){
  .actions{display:grid;grid-template-columns:1fr 1fr;gap:8px}
  .actions #checkin{grid-column:1/-1;justify-content:center}
  .actions .btn{justify-content:center}
}
#checkin.done{background:var(--surface);border:1.5px solid var(--brand);color:var(--brand-dark);box-shadow:none}
#checkin.done .dot{width:8px;height:8px;background:var(--green);box-shadow:none;animation:pulseDot 2s infinite}
.tick{width:19px;height:19px;border:2px solid var(--border);border-radius:6px;flex-shrink:0}
.tick.done{border:none;background:var(--brand);color:var(--charcoal);display:flex;align-items:center;justify-content:center;font-size:12px;font-weight:900}
.donepill{font-size:11px;font-weight:800;color:var(--brand-dark);background:rgba(140,198,63,.16);padding:4px 10px;border-radius:var(--pill);flex-shrink:0}

/* ---------- dealers ---------- */
.dsearch{display:flex;gap:8px;margin-bottom:10px}
.dsearch input{min-height:42px;background:var(--surface)}
.switchrow{display:flex;flex-direction:row;align-items:center;gap:8px;font-size:12.5px;font-weight:600;color:var(--text-2);margin-bottom:12px;cursor:pointer}
.switch{width:34px;height:20px;border-radius:var(--pill);background:var(--border);position:relative;transition:background .16s ease;flex-shrink:0}
.switch::after{content:'';position:absolute;top:2px;left:2px;width:16px;height:16px;border-radius:50%;background:#fff;box-shadow:var(--sh-sm);transition:left .16s ease}
.switchrow input{display:none}
.switchrow input:checked + .switch{background:var(--brand)}
.switchrow input:checked + .switch::after{left:16px}
.dealerlist{display:grid;gap:12px}
@media(min-width:900px){.dealerlist{grid-template-columns:1fr 1fr}}
.dcard{display:flex;flex-direction:column;gap:8px}
.dcard .nm{font-size:15px;font-weight:800}
.dcard .actionsrow{display:flex;gap:8px;padding-top:8px;border-top:1px solid var(--border)}
.dcard .actionsrow .btn{flex:1;min-height:36px;font-size:12.5px}
.audit{background:var(--sunken);border-radius:10px;padding:10px 12px;display:flex;flex-direction:column;gap:6px;font-size:12px}
.audit .arow{display:flex;justify-content:space-between;gap:8px}

/* ---------- team ---------- */
.tcard .toprow{display:flex;justify-content:space-between;align-items:baseline}
.tcard .nm{font-size:15px;font-weight:800}
.tcard .slabchip{font-size:10.5px;font-weight:800;color:var(--text-2);background:var(--sunken);padding:3px 9px;border-radius:var(--pill)}
.tcard .nums{display:flex;justify-content:space-between;font-size:12.5px;color:var(--text-2);font-weight:600;margin-top:8px}
.tcard .nums b{color:var(--text);font-variant-numeric:tabular-nums}
.pbar{height:10px;border-radius:var(--pill);background:var(--sunken);overflow:hidden;margin-top:8px}
.pbar > div{height:100%;background:linear-gradient(90deg,var(--brand),var(--brand-deep));border-radius:var(--pill);transition:width .9s cubic-bezier(.16,1,.3,1)}
.tcard .incrow{display:flex;justify-content:space-between;align-items:center;margin-top:10px;padding-top:8px;border-top:1px solid var(--border)}
.tcard .inc{font-size:16px;font-weight:800;color:var(--brand-dark);font-variant-numeric:tabular-nums}
.slabcard{background:var(--charcoal);border:none;color:#fff;margin-top:12px}
.slabcard h3{color:#fff}
.slabcard .sub{font-size:11.5px;color:#B6BBA6;margin-bottom:8px}
.slabcard .srow{display:flex;justify-content:space-between;padding:9px 0;border-top:1px solid rgba(255,255,255,.12);font-size:13px}
.slabcard .srate{font-weight:800;color:var(--brand)}
.teamtable{overflow:hidden;padding:0}
.tthead{display:grid;grid-template-columns:1.4fr 1fr 1fr 1.6fr .9fr 1fr;gap:12px;padding:12px 20px;background:var(--sunken);
  font-size:11px;font-weight:800;letter-spacing:.04em;color:var(--text-2);text-transform:uppercase}
.ttrow{display:grid;grid-template-columns:1.4fr 1fr 1fr 1.6fr .9fr 1fr;gap:12px;padding:14px 20px;border-top:1px solid var(--border);align-items:center;font-size:13.5px}
.only-mobile{display:block}.only-desktop{display:none}
@media(min-width:900px){.only-mobile{display:none}.only-desktop{display:block}}

.avatar{border-radius:50%;object-fit:cover;background:var(--sunken);color:var(--brand-dark);font-weight:800;
  display:inline-flex;align-items:center;justify-content:center;flex-shrink:0;border:1.5px solid var(--border);overflow:hidden}
.avatar img{width:100%;height:100%;object-fit:cover}
#whoami{cursor:pointer;border-radius:10px;padding:4px 8px;margin:-4px 0}
#whoami:hover{background:var(--sunken)}
.hme{display:flex;align-items:center;gap:8px}
.statuschip{font-size:10px;font-weight:800;letter-spacing:.04em;padding:3px 8px;border-radius:var(--pill)}
.statuschip.active{background:rgba(140,198,63,.16);color:var(--brand-dark)}
.statuschip.inactive{background:rgba(214,69,65,.14);color:var(--red)}

/* ---------- modal / toast ---------- */
#modalroot{position:fixed;inset:0;z-index:100;display:none;align-items:flex-end;justify-content:center;background:rgba(24,23,15,.5)}
@media(min-width:600px){#modalroot{align-items:center;padding:24px}}
.modal{background:var(--surface);width:100%;max-width:560px;max-height:92vh;overflow:auto;border-radius:20px 20px 0 0;
  padding:22px 20px;padding-bottom:calc(22px + env(safe-area-inset-bottom));animation:sheetUp .32s cubic-bezier(.16,1,.3,1) both}
@media(max-width:599px){.modal::before{content:'';display:block;width:40px;height:4px;border-radius:4px;background:var(--lightgrey);margin:-6px auto 12px}}
@media(min-width:600px){.modal{border-radius:var(--radius-xl);padding:26px 24px}}
.modal h3{font-size:18px;font-weight:800;margin-bottom:2px}
.msec{margin-top:16px;padding-top:12px;border-top:1px solid var(--border)}
.msec:first-of-type{border-top:none;padding-top:0;margin-top:8px}
.msec .eyebrow{margin-bottom:-4px}
.mrow{display:grid;grid-template-columns:1fr 1fr;gap:0 12px}
.mfoot{display:flex;gap:10px;justify-content:flex-end;margin-top:20px}
#toast{position:fixed;left:50%;bottom:calc(92px + env(safe-area-inset-bottom));transform:translateX(-50%);z-index:200;background:var(--charcoal);color:#fff;
  padding:11px 20px;border-radius:var(--pill);font-size:13.5px;font-weight:700;opacity:0;pointer-events:none;max-width:90vw;box-shadow:var(--sh-lg)}
#toast.show{opacity:1;animation:toastPop .3s cubic-bezier(.16,1,.3,1) both}
#toast.win{background:var(--brand-deep)}
#toast.err{background:var(--red)}
.empty{padding:16px 8px;text-align:center;color:var(--text-3);font-size:13px}
.filters{display:flex;gap:8px;flex-wrap:wrap;align-items:center;margin-bottom:12px}
</style>
</head>

  for(;;){const k=d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0');

function countUp(el,target,fmt){

  function tick(t){const p=Math.min(1,(t-t0)/dur),e=1-Math.pow(1-p,3);
    el.textContent=fmt(Math.round(from+(target-from)*e));

  requestAnimationFrame(tick);
}

function b64ToU8(b64){
  const pad='='.repeat((4-b64.length%4)%4);
  const raw=atob((b64+pad).replace(/-/g,'+').replace(/_/g,'/'));
  return Uint8Array.from([...raw].map(c=>c.charCodeAt(0)));
}
async function checkPush(){
  try{
    if(!pushCapable())return;
    const reg=await navigator.serviceWorker.ready;
    const s=await reg.pushManager.getSubscription();
    pushOn=!!s&&Notification.permission==='granted';
    if(s&&me){const j=s.toJSON();
      db.from('push_subscriptions').upsert({endpoint:s.endpoint,user_id:me.id,p256dh:j.keys.p256dh,auth_key:j.keys.auth,ua:navigator.userAgent.slice(0,180)}).then(()=>{});}
  }catch(e){}
}
async function enablePush(){
  try{
    if(!pushCapable())return toast('Not supported in this browser','err');
    const perm=await Notification.requestPermission();
    if(perm!=='granted')return toast('Notifications were not allowed','err');
    const reg=await navigator.serviceWorker.ready;
    const sub=await reg.pushManager.subscribe({userVisibleOnly:true,applicationServerKey:b64ToU8(VAPID_PUB)});
    const j=sub.toJSON();
    const {error}=await db.from('push_subscriptions').upsert({endpoint:sub.endpoint,user_id:me.id,p256dh:j.keys.p256dh,auth_key:j.keys.auth,ua:navigator.userAgent.slice(0,180)});
    if(error)return fail(error);
    pushOn=true;buzz(8);toast('Phone notifications on ✓','win');renderNotifPanel();
  }catch(e){toast('Could not enable notifications','err');}
}

function rDash(){
  const deals=visDeals();
  const t0=todayISO();
  const open=deals.filter(d=>['lead','qualified','negotiation'].includes(d.stage));
  const openVal=open.reduce((s,d)=>s+(+d.deal_size||0),0);
  const ms=monthStartISO(), ws=weekStart();
  const wonMTD=deals.filter(d=>d.stage==='won'&&d.won_at&&d.won_at>=ms);
  const mtdVal=wonMTD.reduce((s,d)=>s+(+d.deal_size||0),0);
  const wonWk=deals.filter(d=>d.stage==='won'&&d.won_at&&new Date(d.won_at)>=ws);
  const wkVal=wonWk.reduce((s,d)=>s+(+d.deal_size||0),0);
  const tgts=cache.targets.filter(t=>!stateFilter||stateFilter==='__hq__'||t.state===stateFilter);
  const tgtVal=tgts.reduce((s,t)=>s+(+t.target_amount||0),0);
  const pct=tgtVal? Math.min(100,Math.round(mtdVal/tgtVal*100)) : 0;
  const C=226, ringOff=C*(1-pct/100);
  const in7=new Date(Date.now()+7*864e5);
  const closing=open.filter(d=>d.expected_close&&new Date(d.expected_close)<=in7).sort((a,b)=>(a.expected_close||'').localeCompare(b.expected_close||''));

  // goal-gradient line: distance to next incentive slab (field) — never a dead zero
  let ggLine='';
  if(isField()){
    const myMtd=mtdWonBy(me.id);
    const next=cache.slabs.find(x=>+x.threshold>myMtd);
    const cur=slabFor(myMtd);
    if(cur){ggLine=`Incentive unlocked: ${inr(Math.round(myMtd*+cur.rate))} earned${next?` · ${inr(+next.threshold-myMtd)} to the next slab`:''}`;}
    else if(next){ggLine=`${inr(+next.threshold-myMtd)} more unlocks your ${(+next.rate*100).toFixed(1).replace(/\.0$/,'')}% incentive slab`;}
  }

  // loss-framed attention list
  const attn=[];
  open.forEach(d=>{
    if(d.expected_close&&d.expected_close<t0)attn.push({d,msg:'Close date slipped '+dstr(d.expected_close)});
    else if(!d.next_action)attn.push({d,msg:'No next step — sitting idle'});
  });
  attn.sort((a,b)=>(+b.d.deal_size||0)-(+a.d.deal_size||0));

  const attnCard=attn.length?`<div class="card attn"><h3>${inr(atRisk)} at risk · don\u2019t let it slip</h3>

        <circle cx="43" cy="43" r="36" fill="none" stroke="rgba(255,255,255,.14)" stroke-width="9"/>
        <circle class="arc" cx="43" cy="43" r="36" fill="none" stroke="var(--brand)" stroke-width="9" stroke-linecap="round"

      </svg>

/* ===== Pipeline ===== */
function dealerName(d){
  if(d.segment==='b2c'){const c=(cache.consumers||[]).find(z=>z.id===d.consumer_id);return c?c.name:'Consumer';}
  if(!d.dealer_id)return 'B2B / direct';
  const x=cache.dealers.find(z=>z.id===d.dealer_id);return x?x.name:'—';
}
function rPipeline(){
  let deals=visDeals();
  if(pipeSeg)deals=deals.filter(d=>d.segment===pipeSeg);
  const canCreate=me.role!=='sales_executive';
  const canEdit=me.role!=='admin_entry';
  const sparkles=`<svg class="spark" width="14" height="14" viewBox="0 0 16 16" style="top:2px;left:16%;opacity:.6"><circle cx="8" cy="8" r="3" fill="var(--brand)"/></svg>
    <svg class="spark" width="9" height="9" viewBox="0 0 16 16" style="top:26px;right:20%;opacity:.5;animation-delay:.5s"><circle cx="8" cy="8" r="3" fill="var(--brand-deep)"/></svg>
    <svg class="spark" width="7" height="7" viewBox="0 0 16 16" style="bottom:8px;left:32%;opacity:.45;animation-delay:1s"><circle cx="8" cy="8" r="3" fill="var(--amber)"/></svg>`;
  const STAGE_DOT={lead:'var(--silver)',qualified:'var(--amber)',negotiation:'var(--brand)',won:'var(--brand-deep)',lost:'var(--red)'};
  const cardHtml=d=>{
    const i=STAGES.indexOf(d.stage);
    return `<div class="kcard stage-${d.stage}" data-deal="${d.id}">
      <div class="t">${esc(d.title)}</div>
      <div class="meta"><span class="badge">${d.segment.toUpperCase()}</span>${esc(dealerName(d))}${d.state?' · '+esc(d.state):' · HQ'}</div>
      ${d.next_action?`<div class="na">→ ${esc(d.next_action)}</div>`:''}
      <div class="amtrow"><span class="amt">${inr(d.deal_size)}</span><span class="date">${d.expected_close?dstr(d.expected_close):''}</span></div>
      <div class="hairline"></div>
      ${canEdit?`<div class="foot">
        <button class="mv back" data-mv="-1" ${i===0?'disabled':''}>◀</button>
        <span class="owner">${esc(nameOf(d.owner))}</span>
        <button class="mv fwd" data-mv="1" ${i===STAGES.length-1?'disabled':''}>▶</button></div>`
      :`<div class="foot"><span class="owner">${esc(nameOf(d.owner))}</span></div>`}
      </div>`;};

  // desktop: classic 5-column kanban
  const cols=STAGES.map(st=>{
    const list=deals.filter(d=>d.stage===st);
    const val=list.reduce((s,d)=>s+(+d.deal_size||0),0);
    return `<div class="kcol kc-${st}">
    <div class="kcolhead ${val>0?'has':''}"><span>${STAGE_LABEL[st].toUpperCase()} · ${list.length}</span><span class="sum">${inr(val)}</span></div>
    <div class="kcards">${list.map(cardHtml).join('')||
      (st==='won'?`<div class="kempty">${sparkles}Ready for your first win</div>`:'<div class="kempty">—</div>')}
    </div></div>`;}).join('');

  // mobile: stage chips + full-width card list for the active stage
  const chips=STAGES.map(st=>{
    const list=deals.filter(d=>d.stage===st);
    const val=list.reduce((s,d)=>s+(+d.deal_size||0),0);
    return `<button class="schip ${pipeStage===st?'on':''}" data-stage="${st}">
      <span class="sl"><span class="sdot" style="background:${STAGE_DOT[st]}"></span>${STAGE_LABEL[st]} · ${list.length}</span>
      <span class="sv">${inr(val)}</span></button>`;}).join('');
  const activeList=deals.filter(d=>d.stage===pipeStage);
  const mobileList=activeList.map(cardHtml).join('')||
    (pipeStage==='won'?`<div class="kempty" style="position:relative;padding:34px 8px">${sparkles}Ready for your first win</div>`
    :`<div class="empty">No ${STAGE_LABEL[pipeStage].toLowerCase()} deals${pipeSeg?' in '+pipeSeg.toUpperCase():''}</div>`);

  return `<div class="pagehead"><div><h2>Pipeline</h2><div class="sub">Lead → Qualified → Negotiation → Won / Lost</div></div></div>
  <div class="filters">
    <div class="seg" id="segpick"><button data-s="" class="${pipeSeg===''?'on':''}">All</button><button data-s="b2b" class="${pipeSeg==='b2b'?'on':''}">B2B</button><button data-s="b2c" class="${pipeSeg==='b2c'?'on':''}">B2C</button></div>
    ${canCreate?`<button class="btn btn-primary btn-sm" id="adddeal" style="margin-left:auto">+ ${me.role==='admin_entry'?'New lead':'New deal'}</button>`:''}
  </div>
  <div class="kanban-area kanban">
    <div class="only-desktop"><div class="kanban" style="margin:0;padding:0">${cols}</div></div>
    <div class="only-mobile">
      <div class="stagechips">${chips}</div>
      <div class="stagelist">${mobileList}</div>
    </div>
  </div>`;
}

/* ===== My Day ===== */
function rMyDay(){

  const mine=cache.activities.filter(a=>a.user_id===me.id);

      ${!a.done?`<button class="btn btn-ghost btn-sm" data-done="${a.id}" style="background:var(--sunken)">Done</button>`:'<span class="donepill">done</span>'}</div>`;
  return `<div class="pagehead"><div><h2>My Day</h2><div class="sub">${new Date().toLocaleDateString('en-IN',{weekday:'long',day:'numeric',month:'long'})}</div></div></div>
  <div class="actions" style="margin-bottom:14px">
    <button class="btn btn-ghost${ci?' done':''}" id="checkin">${ci?`<span class="dot"></span>✓ Checked in ${tstr(ci.created_at)}${cis.length>1?' ×'+cis.length:''} · again?`:'📍 Check in'}</button>
    <button class="btn btn-primary" id="logvisit">+ Log a visit</button>
    <button class="btn btn-ghost" id="addtask">+ Task</button>
  </div>
  <div class="dashgrid" style="grid-template-columns:1fr">
    <div class="card"><h3>Due today${tasks.length?` (${tasks.length})`:''}</h3>
      ${tasks.length?tasks.map(a=>li(a,false)).join(''):'<div class="empty">Nothing due — add a task or log a visit</div>'}</div>
    <div class="card"><h3>Upcoming</h3>
      ${upcoming.length?upcoming.map(a=>li(a,false)).join(''):'<div class="empty">No upcoming tasks</div>'}</div>
    <div class="card"><h3>Logged today</h3>
      ${todayLog.length?todayLog.map(a=>li(a,true)).join(''):'<div class="empty">No activity logged yet today</div>'}</div>
  </div>`;
}

/* ===== Team & Incentives ===== */
function mtdWonBy(uid){
  const ms=monthStartISO();
  return cache.deals.filter(d=>d.stage==='won'&&d.owner===uid&&d.won_at&&d.won_at>=ms)
    .reduce((s,d)=>s+(+d.deal_size||0),0);
}
function slabFor(v){let s=null;for(const x of cache.slabs)if(v>=+x.threshold)s=x;return s;}
function rTeam(){
  const team=cache.profiles.filter(p=>['rsm','asm'].includes(p.role)&&p.status==='active'&&(!stateFilter||stateFilter==='__hq__'||p.state===stateFilter))
    .sort((a,b)=>(a.state||'').localeCompare(b.state||'')||a.role.localeCompare(b.role));
  const calc=p=>{
    const tgt=cache.targets.find(t=>t.user_id===p.id);
    const mtd=mtdWonBy(p.id);
    const pct=tgt&&+tgt.target_amount?Math.min(100,Math.round(mtd/+tgt.target_amount*100)):0;
    const slab=slabFor(mtd);
    const inc=slab?mtd*+slab.rate:0;
    return {tgt,mtd,pct,slab,inc};
  };
  const ratefmt=r=>(+r*100).toFixed(2).replace(/\.?0+$/,'')+'%';
  const slabsCard=`<div class="card slabcard"><h3>Incentive slabs</h3>
    <div class="sub">From the existing incentive scheme (Terranova CRM workbook, incentive-sales tab)</div>
    ${cache.slabs.map(s=>`<div class="srow"><span>Reach ${esc(s.label)} (${inr(s.threshold)})</span><span class="srate">${ratefmt(s.rate)} of sales</span></div>`).join('')}
  </div>`;
  const cards=team.map(p=>{
    const {tgt,mtd,pct,slab,inc}=calc(p);
    return `<div class="card tcard lift">
      <div class="toprow"><div style="display:flex;gap:10px;align-items:center">${avatarHtml(p,36)}<div><div class="nm">${esc(p.full_name)}</div>
        <div class="small muted">${ROLE_LABEL[p.role]} · ${esc(p.state||'')}</div></div></div>
        <span class="slabchip">${slab?esc(slab.label):'below ₹5L'}</span></div>

function shrinkImage(file,max){
  return new Promise((res,rej)=>{
    const img=new Image();
    img.onload=()=>{
      const sc=Math.min(1,max/Math.max(img.width,img.height));
      const c=document.createElement('canvas');
      c.width=Math.round(img.width*sc);c.height=Math.round(img.height*sc);
      c.getContext('2d').drawImage(img,0,0,c.width,c.height);
      c.toBlob(b=>b?res(b):rej(new Error('Could not process image')),'image/jpeg',.86);
    };
    img.onerror=()=>rej(new Error('Could not read image'));
    img.src=URL.createObjectURL(file);
  });
}

async function loadTargetsView(){
  const {data,error}=await db.from('targets').select('*').eq('month',tgtMonth);
  if(error)return fail(error);
  window._tgtRows=data||[];
  document.querySelectorAll('[data-tuid]').forEach(inp=>{
    const t=(data||[]).find(x=>x.user_id===inp.dataset.tuid);
    inp.value=t?Math.round(+t.target_amount):'';
  });
}
async function saveTargets(){
  const ups=[],dels=[];
  document.querySelectorAll('[data-tuid]').forEach(inp=>{
    const val=parseFloat(inp.value);
    const existed=(window._tgtRows||[]).find(x=>x.user_id===inp.dataset.tuid);
    if(val>0)ups.push({user_id:inp.dataset.tuid,month:tgtMonth,target_amount:val,state:inp.dataset.tstate||null});
    else if(existed)dels.push(inp.dataset.tuid);
  });
  if(ups.length){const {error}=await db.from('targets').upsert(ups,{onConflict:'user_id,month'});if(error)return fail(error);}
  if(dels.length){const {error}=await db.from('targets').delete().eq('month',tgtMonth).in('user_id',dels);if(error)return fail(error);}
  toast('Targets for '+monthLabel(tgtMonth)+' saved ✓','win');buzz(8);
  await loadAll();render();
}
async function copyPrevTargets(){
  const prev=addMonthsISO(tgtMonth,-1);
  const {data,error}=await db.from('targets').select('*').eq('month',prev);
  if(error)return fail(error);
  if(!data||!data.length)return toast('No targets found for '+monthLabel(prev),'err');
  document.querySelectorAll('[data-tuid]').forEach(inp=>{
    const t=data.find(x=>x.user_id===inp.dataset.tuid);
    if(t)inp.value=Math.round(+t.target_amount);

  toast('Copied from '+monthLabel(prev)+' — review, then Save all');
}

  $('#logvisit')&&($('#logvisit').onclick=visitModal);
  $('#addtask')&&($('#addtask').onclick=taskModal);
  document.querySelectorAll('[data-done]').forEach(b=>b.onclick=async()=>{
    const {error}=await db.from('activities').update({done:true}).eq('id',b.dataset.done);
    error?fail(error):(toast('Done ✓'),refresh());});
  $('#adduser')&&($('#adduser').onclick=()=>userModal(null));
  $('#addproduct')&&($('#addproduct').onclick=()=>productModal(null));
  document.querySelectorAll('[data-av]').forEach(b=>b.onclick=()=>{adminView=b.dataset.av;render();});
  document.querySelectorAll('[data-editproduct]').forEach(b=>b.onclick=()=>{const p=cache.products.find(x=>x.id===b.dataset.editproduct);productModal(p);});
  $('#tg_save')&&($('#tg_save').onclick=saveTargets);
  $('#tg_copy')&&($('#tg_copy').onclick=copyPrevTargets);
  if(curView==='admin'&&adminView==='targets'&&$('#tg_save'))loadTargetsView();
  document.querySelectorAll('[data-edituser]').forEach(b=>b.onclick=()=>{const p=cache.profiles.find(x=>x.id===b.dataset.edituser);userModal(p);});
  document.querySelectorAll('[data-resetpw]').forEach(b=>b.onclick=()=>{const p=cache.profiles.find(x=>x.id===b.dataset.resetpw);resetPwModal(p);});
  document.querySelectorAll('[data-changeemail]').forEach(b=>b.onclick=()=>{const p=cache.profiles.find(x=>x.id===b.dataset.changeemail);changeEmailModal(p);});
  document.querySelectorAll('[data-togglestatus]').forEach(b=>b.onclick=async()=>{
    const p=cache.profiles.find(x=>x.id===b.dataset.togglestatus);
    const to=p.status==='active'?'inactive':'active';
    if(!confirm((to==='inactive'?'Deactivate ':'Reactivate ')+p.full_name+'?'+(to==='inactive'?' They will lose access immediately.':'')))return;
    const {error}=await db.from('profiles').update({status:to}).eq('id',p.id);
    error?fail(error):(toast(to==='inactive'?'User deactivated':'User reactivated'),refresh());
  });
  document.querySelectorAll('[data-fs]').forEach(r=>r.onclick=e=>{
    if(e.target.closest('.dchip')||e.target.closest('.trailmap')||e.target.closest('a'))return;
    const x=document.getElementById('fs-'+r.dataset.fs);
    if(x){x.hidden=!x.hidden;r.classList.toggle('open',!x.hidden);
      if(!x.hidden){buzz(6);const days=ciDays(r.dataset.fs);if(days.length)renderTrailMap(r.dataset.fs,days[0][0]);}
    }
  });
  document.querySelectorAll('.dchip').forEach(c=>c.onclick=e=>{
    e.stopPropagation();
    if(c.dataset.tm){tgtMonth=c.dataset.tm;render();return;}
    c.closest('.daychips').querySelectorAll('.dchip').forEach(x=>x.classList.remove('on'));
    c.classList.add('on');
    renderTrailMap(c.dataset.uid,c.dataset.day);
  });
  // checked-in state class
  const ci=$('#checkin'); if(ci&&ci.textContent.includes('Checked in'))ci.classList.add('done');
}

async function moveStage(id,dir){
  const d=cache.deals.find(x=>x.id===id);if(!d)return;
  const i=STAGES.indexOf(d.stage)+dir;
  if(i<0||i>=STAGES.length)return;
  const {error}=await db.from('deals').update({stage:STAGES[i]}).eq('id',id);
  if(error)return fail(error);
  pipeStage=STAGES[i];
  if(STAGES[i]==='won'){toast('Deal marked as Won 🎉','win');buzz([20,60,20]);tickPush();}
  else {toast(`Moved to ${STAGE_LABEL[STAGES[i]]}`);buzz(8);}
  refresh();
}
async function toggleHist(id){
  const tr=$('#hist-'+id);tr.hidden=!tr.hidden;
  if(tr.hidden)return;
  const {data,error}=await db.from('dealer_audit').select('*').eq('dealer_id',id).order('at',{ascending:false}).limit(20);
  if(error)return fail(error);
  $('#histbody-'+id).innerHTML=data.length?data.map(a=>{
    let extra='';
    if(a.action==='reassigned'&&a.detail?.from)extra=` — ${esc(a.detail.from.state||'')}${a.detail.from.district?'/'+esc(a.detail.from.district):''} → ${esc(a.detail.to.state||'')}${a.detail.to.district?'/'+esc(a.detail.to.district):''}`;
    return `<div class="arow"><span style="font-weight:600">${a.action}${extra}</span><span class="muted" style="flex-shrink:0">${esc(nameOf(a.actor))} · ${new Date(a.at).toLocaleString('en-IN',{day:'numeric',month:'short',hour:'2-digit',minute:'2-digit'})}</span></div>`;
  }).join(''):'No history';
}

    <label>District${me.role==='asm'?`<select id="c_dist">${(me.districts||[]).map(x=>`<option ${c.district===x?'selected':''}>${x}</option>`).join('')}</select>`:`<input id="c_dist" value="${esc(c.district||'')}">`}</label>
    <label>Source<select id="c_src">${SOURCES.map(s=>`<option ${c.source===s?'selected':''}>${s}</option>`).join('')}</select></label>
    <label>Status<select id="c_status"><option value="active" ${c.status!=='removed'?'selected':''}>Active</option><option value="removed" ${c.status==='removed'?'selected':''}>Removed</option></select></label>
  </div>
  <label>Address <span class="hint">(site / installation)</span><input id="c_addr" value="${esc(c.address||'')}"></label>
  <div class="mfoot"><button class="btn btn-plain" onclick="closeModal()">Cancel</button>
  <button class="btn btn-primary" id="c_save">${isNew?'Add consumer':'Save'}</button></div>`);
  $('#c_save').onclick=async()=>{
    const v=x=>$(x).value||null;
    if(!v('#c_name'))return toast('Name is required','err');
    const payload={name:v('#c_name'),phone:v('#c_ph'),email:v('#c_em'),state:$('#c_state').value,
      district:v('#c_dist'),source:$('#c_src').value,status:$('#c_status').value,address:v('#c_addr')};
    const q=isNew?db.from('consumers').insert(payload):db.from('consumers').update(payload).eq('id',c.id);
    const {error}=await q;
    if(error)return fail(error.message?.includes('row-level security')?{message:'Not allowed — this change crosses your territory boundary.'}:error);
    closeModal();toast(isNew?'Consumer added':'Saved');refresh();
  };
}

function taskModal(){
  openModal(`<h3>New task</h3>
  <label>What *<input id="t_title" placeholder="e.g. Call Sunrise Electricals re: quote"></label>
  <div class="mrow">
    <label>Type<select id="t_type"><option value="task">Task</option><option value="call">Call</option><option value="visit">Visit</option></select></label>
    <label>Due date<input id="t_due" type="date" value="${todayISO()}"></label>
  </div>
  <label>Customer (optional)<select id="t_dealer"><option value="">—</option>
    <optgroup label="Dealers &amp; Distributors">${cache.dealers.filter(x=>x.status==='active').map(x=>`<option value="${x.id}">${esc(x.name)}</option>`).join('')}</optgroup>
    <optgroup label="Consumers">${(cache.consumers||[]).filter(x=>x.status==='active').map(x=>`<option value="c:${x.id}">${esc(x.name)}</option>`).join('')}</optgroup>
  </select></label>
  <div class="mfoot"><button class="btn btn-plain" onclick="closeModal()">Cancel</button>
  <button class="btn btn-primary" id="t_save">Add</button></div>`);
  $('#t_save').onclick=async()=>{
    if(!$('#t_title').value)return toast('Title is required','err');
    const tsel=$('#t_dealer').value;
    const {error}=await db.from('activities').insert({type:$('#t_type').value,title:$('#t_title').value,
      due_date:$('#t_due').value||null,
      dealer_id:tsel&&!tsel.startsWith('c:')?tsel:null,
      consumer_id:tsel.startsWith('c:')?tsel.slice(2):null,user_id:me.id});
    if(error)return fail(error);
    closeModal();toast('Task added');refresh();};
}

function visitModal(){
  openModal(`<h3>Log a visit</h3><div class="small muted">Quick field entry — same record as Pipeline, abbreviated</div>
  <label>Customer *<select id="v_dealer"><option value="">— choose —</option>
    <optgroup label="Dealers &amp; Distributors">${cache.dealers.filter(x=>x.status==='active').map(x=>`<option value="${x.id}">${esc(x.name)}${x.district?' ('+esc(x.district)+')':''}</option>`).join('')}</optgroup>
    <optgroup label="Consumers">${(cache.consumers||[]).filter(x=>x.status==='active').map(x=>`<option value="c:${x.id}">${esc(x.name)}${x.district?' ('+esc(x.district)+')':''}</option>`).join('')}</optgroup>
  </select></label>
  <label>Visit notes *<textarea id="v_notes" rows="3" placeholder="Who you met, what was discussed, stock situation…"></textarea></label>
  <label>Linked deal (optional)<select id="v_deal"><option value="">—</option>${cache.deals.filter(d=>!['won','lost'].includes(d.stage)).map(d=>`<option value="${d.id}">${esc(d.title)}</option>`).join('')}</select></label>
  <label>Next action for that deal<input id="v_na" placeholder="e.g. Send revised quote by Friday"></label>
  <div class="mfoot"><button class="btn btn-plain" onclick="closeModal()">Cancel</button>
  <button class="btn btn-primary" id="v_save">Log visit</button></div>`);
  $('#v_save').onclick=async()=>{
    const vsel=$('#v_dealer').value;
    if(!vsel)return toast('Pick the customer you visited','err');
    if(!$('#v_notes').value)return toast('Add a short note','err');
    const {error}=await db.from('activities').insert({type:'visit',title:'Visit logged',done:true,
      dealer_id:!vsel.startsWith('c:')?vsel:null,
      consumer_id:vsel.startsWith('c:')?vsel.slice(2):null,
      notes:$('#v_notes').value,user_id:me.id,due_date:todayISO()});
    if(error)return fail(error);
    if($('#v_deal').value&&$('#v_na').value){
      const {error:e2}=await db.from('deals').update({next_action:$('#v_na').value}).eq('id',$('#v_deal').value);
      if(e2)fail(e2);
    }
    closeModal();toast('Visit logged ✓');refresh();};
}

function checkin(){
  if(!navigator.geolocation)return toast('Location not available on this device','err');
  toast('Getting your location…');
  navigator.geolocation.getCurrentPosition(async pos=>{
    const {error}=await db.from('activities').insert({type:'check_in',title:'Check-in',done:true,user_id:me.id,
      gps_lat:pos.coords.latitude,gps_lng:pos.coords.longitude,due_date:todayISO(),
      notes:`±${Math.round(pos.coords.accuracy)}m`});
    error?fail(error):(toast('Checked in ✓','win'),refresh());
  },err=>toast('Could not get location: '+err.message,'err'),{enableHighAccuracy:true,timeout:12000});
}

/* ---------- start ---------- */
if('serviceWorker' in navigator){try{navigator.serviceWorker.register('./sw.js');}catch(e){}}
db.auth.onAuthStateChange((ev)=>{if(ev==='SIGNED_OUT'){me=null;}});
boot();
</script>
