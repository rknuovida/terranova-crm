<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#2B2A29">
<title>Terranova Sales CRM</title>
<link rel="manifest" href="./manifest.json">
<link rel="icon" type="image/png" href="./icon-64.png">
<link rel="apple-touch-icon" href="./icon-192.png">
<script src="./supabase.min.js"></script>
<style>
/* ============ Terranova CRM — redesign tokens (per design handover) ============ */
@font-face{
  font-family:'Plus Jakarta Sans';
  src:url('./PlusJakartaSans.woff2') format('woff2-variations');
  font-weight:200 800;
  font-display:swap;
}
:root{
  --brand:#8CC63F; --brand-deep:#78B833; --brand-dark:#5C8F27;
  --charcoal:#2B2A29; --charcoal-deep:#18170F;
  --silver:#B2B3B3; --lightgrey:#D9DADA;
  --green:#5BA829; --amber:#E8A33D; --red:#D64541;
  --bg:#F5F6F1; --surface:#FFFFFF; --sunken:#ECEEE6; --border:#E2E4D9;
  --text:#221F1C; --text-2:#65675C; --text-3:#9A9C90;
  --radius-sm:8px; --radius-md:12px; --radius-lg:16px; --radius-xl:24px; --pill:999px;
  --sh-sm:0 1px 2px rgba(34,31,28,.08);
  --sh-md:0 6px 20px rgba(34,31,28,.10);
  --sh-lg:0 24px 56px rgba(34,31,28,.18);
  --glow:0 10px 28px rgba(140,198,63,.38);
  --font:'Plus Jakarta Sans',-apple-system,"Segoe UI",Arial,sans-serif;
}
*{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%}
body{font-family:var(--font);background:var(--bg);color:var(--text);font-size:15px;-webkit-font-smoothing:antialiased}
button{font:inherit;cursor:pointer;border:none;background:none;color:inherit}
button,input,select,a{transition:background .16s ease,color .16s ease,border-color .16s ease,box-shadow .16s ease,transform .16s ease,opacity .16s ease}
a{color:var(--brand-dark)} a:hover{color:var(--brand-deep)}
::-webkit-scrollbar{width:10px;height:10px}
::-webkit-scrollbar-thumb{background:var(--lightgrey);border-radius:999px}
.tnum{font-variant-numeric:tabular-nums}

@keyframes pulseDot{0%,100%{opacity:1;transform:scale(1)}50%{opacity:.45;transform:scale(.85)}}
@keyframes frameIn{from{opacity:0;transform:translateY(14px) scale(.985)}to{opacity:1;transform:translateY(0) scale(1)}}
@keyframes breathe{0%,100%{opacity:.28;transform:translateX(-50%) scale(1)}50%{opacity:.42;transform:translateX(-50%) scale(1.08)}}
@keyframes sparkTwinkle{0%,100%{opacity:.25;transform:scale(.7)}50%{opacity:.9;transform:scale(1.15)}}
@keyframes ringGrow{from{opacity:0;transform:scale(.8)}to{opacity:1;transform:scale(1)}}
@keyframes toastPop{from{opacity:0;transform:translate(-50%,10px) scale(.96)}to{opacity:1;transform:translate(-50%,0) scale(1)}}
@keyframes sheetUp{from{transform:translateY(30px);opacity:.4}to{transform:translateY(0);opacity:1}}

/* ---------- form primitives ---------- */
input,select,textarea{font:inherit;color:var(--text);width:100%;min-height:44px;padding:0 13px;
  border:1.5px solid var(--border);border-radius:9px;background:var(--sunken);outline:none}
textarea{padding:10px 13px;min-height:70px}
input:focus,select:focus,textarea:focus{background:#fff;border-color:var(--brand-deep);box-shadow:0 0 0 3px rgba(140,198,63,.25)}
input:disabled,select:disabled{background:var(--border);color:var(--text-2);cursor:not-allowed}
label{display:flex;flex-direction:column;gap:5px;font-size:12.5px;font-weight:700;color:var(--text-2);margin-top:12px}
label .hint{font-weight:600;color:var(--text-3)}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:6px;min-height:44px;padding:0 16px;
  border-radius:10px;font-weight:800;font-size:13.5px}
.btn:active{transform:translateY(0);filter:brightness(.95)}
.btn-primary{background:linear-gradient(180deg,var(--brand),var(--brand-deep));color:var(--charcoal);box-shadow:var(--sh-sm)}
.btn-primary:hover{transform:translateY(-1px);box-shadow:var(--glow)}
.btn-ghost{background:var(--surface);border:1px solid var(--border);color:var(--text)}
.btn-ghost:hover{background:var(--sunken)}
.btn-plain{color:var(--text-2)}
.btn-danger{background:#fff;border:1px solid var(--red);color:var(--red)}
.btn-sm{min-height:36px;padding:0 13px;font-size:12.5px;border-radius:9px}
.chip{display:inline-block;padding:3px 8px;border-radius:var(--pill);font-size:10px;font-weight:800;letter-spacing:.05em}
.chip-brand{color:var(--brand-dark);background:rgba(140,198,63,.16)}
.badge{display:inline-block;padding:2px 7px;border-radius:6px;font-size:10.5px;font-weight:700;background:var(--sunken);color:var(--text)}
.badge-removed{background:rgba(214,69,65,.15);color:var(--red);border-radius:var(--pill);padding:3px 9px;font-weight:800}
.muted{color:var(--text-3)}.small{font-size:12.5px}
.card{background:var(--surface);border:1px solid var(--border);border-radius:var(--radius-lg);padding:16px;box-shadow:var(--sh-sm)}
.card h3{font-size:15px;font-weight:800;margin-bottom:4px}
.lift{transition:transform .18s ease,box-shadow .18s ease}
.lift:hover{transform:translateY(-2px);box-shadow:var(--sh-md)}
.hairline{height:1px;background:var(--border)}
.row{display:flex;align-items:center;gap:10px;padding:11px 0;border-top:1px solid var(--border)}
.row:first-of-type{border-top:none}
.eyebrow{font-size:10.5px;font-weight:800;letter-spacing:.06em;color:var(--text-3);text-transform:uppercase}
.viewwrap{animation:frameIn .5s cubic-bezier(.16,1,.3,1) both}
.pagehead{display:flex;align-items:flex-end;justify-content:space-between;gap:12px;margin-bottom:14px;flex-wrap:wrap}
.pagehead h2{font-size:20px;font-weight:800}
@media(min-width:768px){.pagehead h2{font-size:24px}}
.pagehead .sub{font-size:13px;color:var(--text-2)}

/* ---------- login ---------- */
#login{min-height:100%;display:flex;flex-direction:column;align-items:center;justify-content:center;padding:28px;position:relative;overflow:hidden;
  background:radial-gradient(120% 90% at 50% -10%,#2E3B1C 0%,var(--charcoal-deep) 55%,#0F0E09 100%)}
#login .glow{position:absolute;top:-40px;left:50%;width:260px;height:260px;border-radius:50%;background:var(--brand);filter:blur(70px);animation:breathe 5s ease-in-out infinite}
#login .rings{position:absolute;top:38px;left:50%;transform:translateX(-50%);opacity:.14;pointer-events:none}
#login .card{position:relative;width:100%;max-width:380px;border:none;border-radius:20px;box-shadow:var(--sh-lg);padding:32px 26px;
  animation:frameIn .6s .1s cubic-bezier(.16,1,.3,1) both}
#login .lgo svg{height:34px;width:auto;display:block}
#login .eyebrow{margin-top:10px;letter-spacing:.08em;font-size:12px}
#login .hairline{margin:16px 0}
#lbtn{width:100%;min-height:48px;margin-top:18px;box-shadow:var(--glow)}
#lbtn:hover{box-shadow:0 14px 32px rgba(140,198,63,.48)}
#loginerr{font-size:13px;font-weight:600;color:var(--red);margin-top:12px;min-height:18px}
#login .foot{position:relative;margin-top:26px;font-size:12px;color:#9BA394;text-align:center}

/* ---------- shell ---------- */
#app{display:none;min-height:100%}
header{position:sticky;top:0;z-index:40;background:var(--surface);border-bottom:1px solid var(--border)}
.hwrap{max-width:1280px;margin:0 auto;display:flex;align-items:center;gap:10px;padding:14px 18px}
@media(min-width:768px){.hwrap{padding:14px 32px}}
.hwrap .logo svg{height:20px;width:auto;display:block}
@media(min-width:768px){.hwrap .logo svg{height:24px}}
.hspace{flex:1}
#whoami{text-align:right;line-height:1.25}
#whoami .n{font-weight:700;font-size:13px}
#whoami .r{font-size:11px;color:var(--text-3)}
#statepick{width:auto;min-height:38px;padding:0 28px 0 12px;font-size:13px;font-weight:600;background:var(--surface);border:1px solid var(--border);border-radius:8px}
#logout{min-height:34px;border:1px solid var(--border);background:var(--surface);border-radius:8px;padding:0 12px;font-size:12px;font-weight:700}
nav{background:var(--surface)}
.nwrap{max-width:1280px;margin:0 auto;display:flex}
nav button{flex:1;display:flex;flex-direction:column;align-items:center;gap:3px;padding:9px 0 12px;
  font-size:10.5px;font-weight:700;color:var(--text-3);border-top:2px solid transparent}
nav button svg{width:20px;height:20px}
nav button.on{color:var(--brand-dark);border-top-color:var(--brand)}
main{max-width:1280px;margin:0 auto;padding:18px;padding-bottom:96px}
@media(min-width:768px){
  main{padding:28px 32px 48px}
  nav{border-bottom:1px solid var(--border)}
  nav button{flex:0 0 auto;flex-direction:row;gap:7px;font-size:14px;padding:12px 18px;border-top:none;border-bottom:2px solid transparent}
  nav button.on{border-bottom-color:var(--brand)}
}
@media(max-width:767px){
  nav{position:fixed;bottom:0;left:0;right:0;border-top:1px solid var(--border);padding-bottom:env(safe-area-inset-bottom);z-index:50}
}

/* ---------- dashboard ---------- */
.kpis{display:flex;flex-wrap:wrap;gap:12px;margin-bottom:14px}
@media(min-width:900px){.kpis{gap:16px}}
.kpi{position:relative;overflow:hidden;flex:1 1 150px;background:var(--surface);border:1px solid var(--border);
  border-radius:var(--radius-lg);padding:16px;box-shadow:var(--sh-sm);transition:transform .18s ease,box-shadow .18s ease}
.kpi:hover{transform:translateY(-3px);box-shadow:var(--sh-md)}
@media(min-width:900px){.kpi{padding:20px}}
.kpi .accent{position:absolute;top:0;left:0;right:0;height:4px;background:var(--lightgrey)}
.kpi.live .accent{background:linear-gradient(90deg,var(--brand),var(--brand-deep))}
.kpi .val{font-size:26px;font-weight:800;margin-top:6px;font-variant-numeric:tabular-nums}
@media(min-width:900px){.kpi .val{font-size:32px;margin-top:8px}}
.kpi .sub{font-size:12px;color:var(--text-2);margin-top:2px}
.kpi-ring{flex:1 1 100%;display:flex;align-items:center;gap:16px;background:var(--charcoal);border:none;
  border-radius:18px;padding:18px;box-shadow:var(--sh-md);color:#fff}
.kpi-ring:hover{box-shadow:var(--sh-lg)}
@media(min-width:900px){.kpi-ring{flex:1 1 300px;border-radius:var(--radius-lg);padding:20px}}
.kpi-ring .eyebrow{color:#C7CBB8}
.kpi-ring .val{font-size:22px;color:#fff}
.kpi-ring .sub{color:#B6BBA6}
.kpi-ring svg{flex-shrink:0;animation:ringGrow .6s cubic-bezier(.16,1,.3,1) both}
.kpi-ring circle.arc{transition:stroke-dashoffset .9s cubic-bezier(.16,1,.3,1)}
.dashgrid{display:grid;gap:14px}
@media(min-width:900px){.dashgrid{grid-template-columns:1.3fr 1fr;gap:16px;align-items:start}}
.dot{width:11px;height:11px;border-radius:50%;flex-shrink:0;display:inline-block}
.d-g{background:var(--green);box-shadow:0 0 0 4px rgba(91,168,41,.13);animation:pulseDot 2s infinite}
.d-a{background:var(--amber);box-shadow:0 0 0 4px rgba(232,163,61,.13)}
.d-r{background:var(--red);box-shadow:0 0 0 4px rgba(214,69,65,.13)}

/* ---------- pipeline ---------- */
.seg{display:inline-flex;background:var(--sunken);border-radius:9px;padding:3px;gap:2px}
.seg button{padding:7px 12px;border-radius:7px;font-size:12.5px;font-weight:700;color:var(--text-2)}
.seg button.on{background:var(--surface);color:var(--text);box-shadow:var(--sh-sm)}
.kanban{display:flex;gap:12px;overflow-x:auto;padding-bottom:8px;margin:0 -18px;padding-left:18px;padding-right:18px;-webkit-overflow-scrolling:touch}
@media(min-width:1024px){.kanban{display:grid;grid-template-columns:repeat(5,1fr);overflow:visible;margin:0;padding:0}}
.kcol{width:250px;flex-shrink:0}
@media(min-width:1024px){.kcol{width:auto}}
.kcolhead{border-top:4px solid var(--silver);background:var(--surface);border-radius:0 0 12px 12px;padding:10px 12px;
  display:flex;justify-content:space-between;box-shadow:var(--sh-sm);font-size:12px;font-weight:800;letter-spacing:.03em}
.kcolhead .sum{color:var(--text-3);font-variant-numeric:tabular-nums}
.kcolhead.has .sum{color:var(--text)}
.kc-lead .kcolhead{border-top-color:var(--silver)}
.kc-qualified .kcolhead{border-top-color:var(--amber)}
.kc-negotiation .kcolhead{border-top-color:var(--brand)}
.kc-won .kcolhead{border-top-color:var(--brand-deep);background:linear-gradient(135deg,var(--brand),var(--brand-deep));box-shadow:var(--glow);color:#fff}
.kc-won .kcolhead .sum{color:#fff}
.kc-lost .kcolhead{border-top-color:var(--red)}
.kcards{display:flex;flex-direction:column;gap:10px;margin-top:10px}
.kempty{padding:22px 8px;text-align:center;color:var(--text-3);font-size:13px;position:relative}
.kc-won .kempty{color:var(--brand-dark);font-weight:700;font-size:12.5px}
.spark{position:absolute;animation:sparkTwinkle 2.4s ease-in-out infinite}
.kcard{background:var(--surface);border:1px solid var(--border);border-left:4px solid var(--brand);border-radius:12px;
  padding:14px;box-shadow:var(--sh-sm);display:flex;flex-direction:column;gap:8px;cursor:pointer;
  transition:transform .18s ease,box-shadow .18s ease}
.kcard:hover{transform:translateY(-3px);box-shadow:var(--sh-md)}
.kcard .t{font-size:14px;font-weight:700;line-height:1.3}
.kcard .meta{display:flex;align-items:center;gap:6px;font-size:12px;color:var(--text-2);flex-wrap:wrap}
.kcard .na{font-size:12.5px;color:var(--brand-dark);font-weight:600}
.kcard .amtrow{display:flex;justify-content:space-between;align-items:baseline}
.kcard .amt{font-size:18px;font-weight:800;font-variant-numeric:tabular-nums}
.kcard .date{font-size:12px;color:var(--text-3)}
.kcard .foot{display:flex;justify-content:space-between;align-items:center}
.kcard .foot .owner{font-size:12px;font-weight:600;color:var(--text-2)}
.kcard .mv{width:30px;height:30px;border-radius:8px;font-weight:700;display:inline-flex;align-items:center;justify-content:center}
.kcard .mv.back{border:1px solid var(--border);background:var(--sunken)}
.kcard .mv.fwd{background:var(--charcoal);color:#fff}
.kcard .mv:disabled{opacity:.25;cursor:default}
.stage-lead{border-left-color:var(--silver)}.stage-qualified{border-left-color:var(--amber)}
.stage-negotiation{border-left-color:var(--brand)}.stage-won{border-left-color:var(--brand-deep)}.stage-lost{border-left-color:var(--red)}

/* ---------- my day ---------- */
.actions{display:flex;gap:8px;flex-wrap:wrap}
#checkin.done{background:var(--surface);border:1.5px solid var(--brand);color:var(--brand-dark);box-shadow:none}
#checkin.done .dot{width:8px;height:8px;background:var(--green);box-shadow:none;animation:pulseDot 2s infinite}
.tick{width:19px;height:19px;border:2px solid var(--border);border-radius:6px;flex-shrink:0}
.tick.done{border:none;background:var(--brand);color:var(--charcoal);display:flex;align-items:center;justify-content:center;font-size:12px;font-weight:900}
.donepill{font-size:11px;font-weight:800;color:var(--brand-dark);background:rgba(140,198,63,.16);padding:4px 10px;border-radius:var(--pill);flex-shrink:0}

/* ---------- dealers ---------- */
.dsearch{display:flex;gap:8px;margin-bottom:10px}
.dsearch input{min-height:42px;background:var(--surface)}
.switchrow{display:flex;flex-direction:row;align-items:center;gap:8px;font-size:12.5px;font-weight:600;color:var(--text-2);margin-bottom:12px;cursor:pointer}
.switch{width:34px;height:20px;border-radius:var(--pill);background:var(--border);position:relative;transition:background .16s ease;flex-shrink:0}
.switch::after{content:'';position:absolute;top:2px;left:2px;width:16px;height:16px;border-radius:50%;background:#fff;box-shadow:var(--sh-sm);transition:left .16s ease}
.switchrow input{display:none}
.switchrow input:checked + .switch{background:var(--brand)}
.switchrow input:checked + .switch::after{left:16px}
.dealerlist{display:grid;gap:12px}
@media(min-width:900px){.dealerlist{grid-template-columns:1fr 1fr}}
.dcard{display:flex;flex-direction:column;gap:8px}
.dcard .nm{font-size:15px;font-weight:800}
.dcard .actionsrow{display:flex;gap:8px;padding-top:8px;border-top:1px solid var(--border)}
.dcard .actionsrow .btn{flex:1;min-height:36px;font-size:12.5px}
.audit{background:var(--sunken);border-radius:10px;padding:10px 12px;display:flex;flex-direction:column;gap:6px;font-size:12px}
.audit .arow{display:flex;justify-content:space-between;gap:8px}

/* ---------- team ---------- */
.tcard .toprow{display:flex;justify-content:space-between;align-items:baseline}
.tcard .nm{font-size:15px;font-weight:800}
.tcard .slabchip{font-size:10.5px;font-weight:800;color:var(--text-2);background:var(--sunken);padding:3px 9px;border-radius:var(--pill)}
.tcard .nums{display:flex;justify-content:space-between;font-size:12.5px;color:var(--text-2);font-weight:600;margin-top:8px}
.tcard .nums b{color:var(--text);font-variant-numeric:tabular-nums}
.pbar{height:10px;border-radius:var(--pill);background:var(--sunken);overflow:hidden;margin-top:8px}
.pbar > div{height:100%;background:linear-gradient(90deg,var(--brand),var(--brand-deep));border-radius:var(--pill);transition:width .9s cubic-bezier(.16,1,.3,1)}
.tcard .incrow{display:flex;justify-content:space-between;align-items:center;margin-top:10px;padding-top:8px;border-top:1px solid var(--border)}
.tcard .inc{font-size:16px;font-weight:800;color:var(--brand-dark);font-variant-numeric:tabular-nums}
.slabcard{background:var(--charcoal);border:none;color:#fff;margin-top:12px}
.slabcard h3{color:#fff}
.slabcard .sub{font-size:11.5px;color:#B6BBA6;margin-bottom:8px}
.slabcard .srow{display:flex;justify-content:space-between;padding:9px 0;border-top:1px solid rgba(255,255,255,.12);font-size:13px}
.slabcard .srate{font-weight:800;color:var(--brand)}
.teamtable{overflow:hidden;padding:0}
.tthead{display:grid;grid-template-columns:1.4fr 1fr 1fr 1.6fr .9fr 1fr;gap:12px;padding:12px 20px;background:var(--sunken);
  font-size:11px;font-weight:800;letter-spacing:.04em;color:var(--text-2);text-transform:uppercase}
.ttrow{display:grid;grid-template-columns:1.4fr 1fr 1fr 1.6fr .9fr 1fr;gap:12px;padding:14px 20px;border-top:1px solid var(--border);align-items:center;font-size:13.5px}
.only-mobile{display:block}.only-desktop{display:none}
@media(min-width:900px){.only-mobile{display:none}.only-desktop{display:block}}

/* ---------- modal / toast ---------- */
#modalroot{position:fixed;inset:0;z-index:100;display:none;align-items:flex-end;justify-content:center;background:rgba(24,23,15,.5)}
@media(min-width:600px){#modalroot{align-items:center;padding:24px}}
.modal{background:var(--surface);width:100%;max-width:560px;max-height:92vh;overflow:auto;border-radius:20px 20px 0 0;
  padding:22px 20px;animation:sheetUp .32s cubic-bezier(.16,1,.3,1) both}
@media(min-width:600px){.modal{border-radius:var(--radius-xl);padding:26px 24px}}
.modal h3{font-size:18px;font-weight:800;margin-bottom:2px}
.msec{margin-top:16px;padding-top:12px;border-top:1px solid var(--border)}
.msec:first-of-type{border-top:none;padding-top:0;margin-top:8px}
.msec .eyebrow{margin-bottom:-4px}
.mrow{display:grid;grid-template-columns:1fr 1fr;gap:0 12px}
.mfoot{display:flex;gap:10px;justify-content:flex-end;margin-top:20px}
#toast{position:fixed;left:50%;bottom:88px;transform:translateX(-50%);z-index:200;background:var(--charcoal);color:#fff;
  padding:11px 20px;border-radius:var(--pill);font-size:13.5px;font-weight:700;opacity:0;pointer-events:none;max-width:90vw;box-shadow:var(--sh-lg)}
#toast.show{opacity:1;animation:toastPop .3s cubic-bezier(.16,1,.3,1) both}
#toast.win{background:var(--brand-deep)}
#toast.err{background:var(--red)}
.empty{padding:16px 8px;text-align:center;color:var(--text-3);font-size:13px}
.filters{display:flex;gap:8px;flex-wrap:wrap;align-items:center;margin-bottom:12px}
</style>
</head>
<body>

<div id="login">
  <div class="glow"></div>
  <svg class="rings" width="220" height="220" viewBox="0 0 220 220">
    <circle cx="110" cy="110" r="60" fill="none" stroke="#8CC63F" stroke-width="1"/>
    <circle cx="110" cy="110" r="86" fill="none" stroke="#8CC63F" stroke-width="1"/>
    <circle cx="110" cy="110" r="108" fill="none" stroke="#8CC63F" stroke-width="1"/>

function toast(m,kind){const t=$('#toast');t.textContent=m;t.className='show'+(kind?' '+kind:'');clearTimeout(t._h);t._h=setTimeout(()=>t.className='',2600);}
function fail(e){console.error(e);toast('⚠ '+(e?.message||'Something went wrong'),'err');}

/* ---------- auth ---------- */
$('#lbtn').onclick=signin;
$('#lpass').addEventListener('keydown',e=>{if(e.key==='Enter')signin();});
async function signin(){
  $('#loginerr').textContent='';
  const {error}=await db.auth.signInWithPassword({email:$('#lemail').value.trim(),password:$('#lpass').value});
  if(error){$('#loginerr').textContent=error.message==='Invalid login credentials'?'Invalid email or password.':error.message;return;}
  boot();
}
$('#logout').onclick=async()=>{await db.auth.signOut();location.reload();};

async function boot(){
  const {data:{session}}=await db.auth.getSession();
  if(!session){$('#login').style.display='flex';$('#app').style.display='none';return;}
  const {data:prof,error}=await db.from('profiles').select('*').eq('id',session.user.id).single();
  if(error||!prof){fail(error||{message:'No profile found for this login.'});await db.auth.signOut();return;}
  if(prof.status!=='active'){toast('This account is deactivated.','err');await db.auth.signOut();return;}
  me=prof;
  $('#login').style.display='none';$('#app').style.display='block';
  $('#whoami .n').textContent=me.full_name;
  $('#whoami .r').textContent=ROLE_LABEL[me.role]+(me.state?' · '+me.state:'');
  const sp=$('#statepick');
  if(isLeader()||me.role==='admin_entry'){
    sp.hidden=false;
    sp.innerHTML='<option value="">All states</option>'+STATES.map(s=>`<option>${s}</option>`).join('')+'<option value="__hq__">HQ / National</option>';
    sp.onchange=()=>{stateFilter=sp.value;render();};
  }
  buildNav();
  await loadAll();
  render();
}

function buildNav(){
  const tabs=[['dash','Dashboard'],['pipeline','Pipeline'],['myday','My Day'],['dealers','Dealers'],['team','Team']];
  $('#navtabs').innerHTML=tabs.filter(([k])=>{
    if(k==='myday'&&!isField())return false;
    if(k==='team'&&me.role==='admin_entry')return false;
    return true;
  }).map(([k,l])=>`<button data-v="${k}" class="${k===curView?'on':''}">${NAV_ICONS[k]}<span>${l}</span></button>`).join('');
  $('#navtabs').querySelectorAll('button').forEach(b=>b.onclick=()=>{curView=b.dataset.v;render();});
}

/* ---------- data ---------- */
async function loadAll(){
  const since=new Date(Date.now()-14*864e5).toISOString();
  const [p,d,de,pr,sl,tg,ac]=await Promise.all([
    db.from('profiles').select('*').order('full_name'),
    db.from('dealers').select('*').order('name'),
    db.from('deals').select('*').order('updated_at',{ascending:false}),
    db.from('products').select('*').eq('active',true).order('sort'),
    db.from('incentive_slabs').select('*').order('threshold'),
    db.from('targets').select('*').eq('month',monthStartISO()),
    db.from('activities').select('*').or(`created_at.gte.${since},done.eq.false`).order('created_at',{ascending:false}).limit(800),
  ]);
  for(const r of [p,d,de,pr,sl,tg,ac]) if(r.error) return fail(r.error);
  cache={profiles:p.data,dealers:d.data,deals:de.data,products:pr.data,slabs:sl.data,targets:tg.data,activities:ac.data};
}
async function refresh(){await loadAll();render();}

const visDeals=()=>cache.deals.filter(x=>!stateFilter||(stateFilter==='__hq__'?x.state===null:x.state===stateFilter));
const visDealers=()=>cache.dealers.filter(x=>(!stateFilter||stateFilter==='__hq__'?true:x.state===stateFilter)&&(showRemoved?true:x.status==='active'));

/* ---------- render ---------- */
function render(){
  buildNav();
  const v=$('#view');
  let html='';
  if(curView==='dash')html=rDash();
  else if(curView==='pipeline')html=rPipeline();
  else if(curView==='myday')html=rMyDay();
  else if(curView==='dealers')html=rDealers();
  else if(curView==='team')html=rTeam();
  v.innerHTML=`<div class="viewwrap">${html}</div>`;
  bindView();
  requestAnimationFrame(animateIn);
}
function animateIn(){
  document.querySelectorAll('circle.arc').forEach(c=>{
    const off=c.dataset.off; requestAnimationFrame(()=>c.style.strokeDashoffset=off);
  });
  document.querySelectorAll('.pbar > div').forEach(b=>{
    const w=b.dataset.w; requestAnimationFrame(()=>b.style.width=w+'%');
  });
}

/* ===== Dashboard ===== */
function rDash(){
  const deals=visDeals();
  const open=deals.filter(d=>['lead','qualified','negotiation'].includes(d.stage));
  const openVal=open.reduce((s,d)=>s+(+d.deal_size||0),0);
  const ms=monthStartISO(), ws=weekStart();
  const wonMTD=deals.filter(d=>d.stage==='won'&&d.won_at&&d.won_at>=ms);
  const mtdVal=wonMTD.reduce((s,d)=>s+(+d.deal_size||0),0);
  const wonWk=deals.filter(d=>d.stage==='won'&&d.won_at&&new Date(d.won_at)>=ws);
  const wkVal=wonWk.reduce((s,d)=>s+(+d.deal_size||0),0);
  const tgts=cache.targets.filter(t=>!stateFilter||stateFilter==='__hq__'||t.state===stateFilter);
  const tgtVal=tgts.reduce((s,t)=>s+(+t.target_amount||0),0);
  const pct=tgtVal? Math.min(100,Math.round(mtdVal/tgtVal*100)) : 0;
  const C=226; // ring circumference (r=36)
  const ringOff=C*(1-pct/100);
  const in7=new Date(Date.now()+7*864e5);
  const closing=open.filter(d=>d.expected_close&&new Date(d.expected_close)<=in7).sort((a,b)=>(a.expected_close||'').localeCompare(b.expected_close||''));

  const team=cache.profiles.filter(p=>['rsm','asm'].includes(p.role)&&p.status==='active'&&(!stateFilter||stateFilter==='__hq__'||p.state===stateFilter));
  const t0=todayISO(), y0=new Date(Date.now()-864e5).toISOString().slice(0,10);
  const rows=team.map(p=>{
    const acts=cache.activities.filter(a=>a.user_id===p.id);
    const last=acts.length?acts[0].created_at.slice(0,10):null;
    const cls=last===t0?'d-g':last===y0?'d-a':'d-r';
    const lbl=last===t0?'Updated today':last===y0?'Updated yesterday':last?('Last update '+dstr(last)):'No updates yet';
    return `<div class="row"><span class="dot ${cls}"></span>
      <div style="flex:1"><div style="font-size:14px;font-weight:700">${esc(p.full_name)}</div>
      <div class="small muted">${ROLE_LABEL[p.role]} · ${esc(p.state||'')}</div></div>
      <span class="small" style="color:var(--text-2);font-weight:600;flex-shrink:0">${lbl}</span></div>`;}).join('');

  return `<div class="pagehead"><div><h2>Dashboard</h2><div class="sub">${isLeader()?(stateFilter?(stateFilter==='__hq__'?'HQ / national view':stateFilter):'All 5 states'):(me.state||'')}${me.districts?.length?' · '+me.districts.join(', '):''}</div></div></div>
  <div class="kpis">
    <div class="kpi ${openVal>0?'live':''}"><div class="accent"></div>
      <div class="eyebrow">Open Pipeline</div><div class="val">${inr(openVal)}</div>
      <div class="sub">${open.length} open deal${open.length===1?'':'s'}</div></div>
    <div class="kpi ${wkVal>0?'live':''}"><div class="accent"></div>
      <div class="eyebrow">Booked This Week</div><div class="val">${inr(wkVal)}</div>
      <div class="sub">${wonWk.length} won since Monday</div></div>
    <div class="kpi kpi-ring">
      <svg width="86" height="86" viewBox="0 0 86 86">
        <circle cx="43" cy="43" r="36" fill="none" stroke="rgba(255,255,255,.14)" stroke-width="9"/>
        <circle class="arc" cx="43" cy="43" r="36" fill="none" stroke="var(--brand)" stroke-width="9" stroke-linecap="round"
          stroke-dasharray="${C}" stroke-dashoffset="${C}" data-off="${ringOff}" transform="rotate(-90 43 43)"/>
        <text x="43" y="49" text-anchor="middle" font-size="18" font-weight="800" fill="#fff" font-family="var(--font)">${pct}%</text>
      </svg>
      <div><div class="eyebrow">Booked This Month vs Target</div>
        <div class="val">${inr(mtdVal)}</div>
        <div class="sub">${tgtVal?('of '+inr(tgtVal)+' target'):'no target set for this month'}</div></div>
    </div>
  </div>
  <div class="dashgrid">
    <div class="card"><h3>Deals closing this week</h3>
      ${closing.length?closing.map(d=>`<div class="row"><div style="flex:1">
        <div style="font-size:14px;font-weight:700">${esc(d.title)}</div>
        <div class="small" style="color:var(--text-2);margin-top:2px">${esc(dealerName(d))}${d.state?' · '+esc(d.state):' · HQ'}</div></div>
        <div style="text-align:right;flex-shrink:0"><div style="font-size:14px;font-weight:800" class="tnum">${inr(d.deal_size)}</div>
        <div class="small muted" style="margin-top:2px">${dstr(d.expected_close)}</div></div></div>`).join('')
      :'<div class="empty">Nothing due in the next 7 days</div>'}
    </div>
    <div class="card"><h3>Field update status</h3>
      ${rows||'<div class="empty">No RSM/ASM visible</div>'}
    </div>
  </div>`;
}

/* ===== Pipeline ===== */
function dealerName(d){if(!d.dealer_id)return d.segment==='b2b'?'B2B / direct':'—';const x=cache.dealers.find(z=>z.id===d.dealer_id);return x?x.name:'—';}
function rPipeline(){
  let deals=visDeals();
  if(pipeSeg)deals=deals.filter(d=>d.segment===pipeSeg);
  const canCreate=me.role!=='sales_executive';
  const sparkles=`<svg class="spark" width="14" height="14" viewBox="0 0 16 16" style="top:2px;left:16%;opacity:.6"><circle cx="8" cy="8" r="3" fill="var(--brand)"/></svg>
    <svg class="spark" width="9" height="9" viewBox="0 0 16 16" style="top:26px;right:20%;opacity:.5;animation-delay:.5s"><circle cx="8" cy="8" r="3" fill="var(--brand-deep)"/></svg>
    <svg class="spark" width="7" height="7" viewBox="0 0 16 16" style="bottom:8px;left:32%;opacity:.45;animation-delay:1s"><circle cx="8" cy="8" r="3" fill="var(--amber)"/></svg>`;
  const cols=STAGES.map(st=>{
    const list=deals.filter(d=>d.stage===st);
    const val=list.reduce((s,d)=>s+(+d.deal_size||0),0);
    return `<div class="kcol kc-${st}">
    <div class="kcolhead ${val>0?'has':''}"><span>${STAGE_LABEL[st].toUpperCase()} · ${list.length}</span><span class="sum">${inr(val)}</span></div>
    <div class="kcards">
    ${list.map(d=>{
      const i=STAGES.indexOf(st), canEdit=me.role!=='admin_entry';
      return `<div class="kcard stage-${st}" data-deal="${d.id}">
      <div class="t">${esc(d.title)}</div>
      <div class="meta"><span class="badge">${d.segment.toUpperCase()}</span>${esc(dealerName(d))}${d.state?' · '+esc(d.state):' · HQ'}</div>
      ${d.next_action?`<div class="na">→ ${esc(d.next_action)}</div>`:''}
      <div class="amtrow"><span class="amt">${inr(d.deal_size)}</span><span class="date">${d.expected_close?dstr(d.expected_close):''}</span></div>
      <div class="hairline"></div>
      ${canEdit?`<div class="foot">
        <button class="mv back" data-mv="-1" ${i===0?'disabled':''}>◀</button>
        <span class="owner">${esc(nameOf(d.owner))}</span>
        <button class="mv fwd" data-mv="1" ${i===STAGES.length-1?'disabled':''}>▶</button></div>`
      :`<div class="foot"><span class="owner">${esc(nameOf(d.owner))}</span></div>`}
      </div>`;}).join('')||
      (st==='won'?`<div class="kempty">${sparkles}Ready for your first win</div>`:'<div class="kempty">—</div>')}
    </div></div>`;}).join('');
  return `<div class="pagehead"><div><h2>Pipeline</h2><div class="sub">Lead → Qualified → Negotiation → Won / Lost</div></div></div>
  <div class="filters">
    <div class="seg" id="segpick"><button data-s="" class="${pipeSeg===''?'on':''}">All</button><button data-s="b2b" class="${pipeSeg==='b2b'?'on':''}">B2B</button><button data-s="b2c" class="${pipeSeg==='b2c'?'on':''}">B2C</button></div>
    ${canCreate?`<button class="btn btn-primary btn-sm" id="adddeal" style="margin-left:auto">+ ${me.role==='admin_entry'?'New lead':'New deal'}</button>`:''}
  </div>
  <div class="kanban">${cols}</div>`;
}

/* ===== My Day ===== */
function rMyDay(){
  const t0=todayISO();
  const mine=cache.activities.filter(a=>a.user_id===me.id);
  const tasks=mine.filter(a=>['task','call','visit'].includes(a.type)&&!a.done&&a.due_date&&a.due_date<=t0)
                  .sort((a,b)=>(a.due_date||'').localeCompare(b.due_date||''));
  const upcoming=mine.filter(a=>['task','call','visit'].includes(a.type)&&!a.done&&(!a.due_date||a.due_date>t0)).slice(0,10);
  const todayLog=mine.filter(a=>a.created_at.slice(0,10)===t0&&(a.type==='check_in'||a.type==='visit'||a.done));
  const ci=mine.find(a=>a.type==='check_in'&&a.created_at.slice(0,10)===t0);
  const li=(a,done)=>`<div class="row">
      <span class="tick ${done?'done':''}">${done?'✓':''}</span>
      <div style="flex:1"><div style="font-size:14px;font-weight:700">${esc(a.title||a.type)}</div>
      <div class="small muted">${a.dealer_id?esc((cache.dealers.find(d=>d.id===a.dealer_id)||{}).name||''):''}${a.due_date?' · due '+dstr(a.due_date):''}${a.notes?' · '+esc(a.notes):''}</div></div>
      ${!a.done?`<button class="btn btn-ghost btn-sm" data-done="${a.id}" style="background:var(--sunken)">Done</button>`:'<span class="donepill">done</span>'}</div>`;
  return `<div class="pagehead"><div><h2>My Day</h2><div class="sub">${new Date().toLocaleDateString('en-IN',{weekday:'long',day:'numeric',month:'long'})}</div></div></div>
  <div class="actions" style="margin-bottom:14px">
    <button class="btn btn-ghost${ci?' done':''}" id="checkin">${ci?`<span class="dot"></span>✓ Checked in ${new Date(ci.created_at).toLocaleTimeString('en-IN',{hour:'2-digit',minute:'2-digit'})}`:'📍 Check in'}</button>
    <button class="btn btn-primary" id="logvisit">+ Log a visit</button>
    <button class="btn btn-ghost" id="addtask">+ Task</button>
  </div>
  <div class="dashgrid" style="grid-template-columns:1fr">
    <div class="card"><h3>Due today${tasks.length?` (${tasks.length})`:''}</h3>
      ${tasks.length?tasks.map(a=>li(a,false)).join(''):'<div class="empty">Nothing due — add a task or log a visit</div>'}</div>
    <div class="card"><h3>Upcoming</h3>
      ${upcoming.length?upcoming.map(a=>li(a,false)).join(''):'<div class="empty">No upcoming tasks</div>'}</div>
    <div class="card"><h3>Logged today</h3>
      ${todayLog.length?todayLog.map(a=>li(a,true)).join(''):'<div class="empty">No activity logged yet today</div>'}</div>
  </div>`;
}

  <div class="dsearch">
    <input id="dq" placeholder="Search dealers, district, contact…" value="${esc(window._dq||'')}">

  </div>
  <label class="switchrow"><input type="checkbox" id="showrm" ${showRemoved?'checked':''}><span class="switch"></span>Show removed</label>
  <div class="dealerlist">
    ${list.map(d=>`<div class="card dcard lift" ${d.status==='removed'?'style="opacity:.55"':''}>
      <div style="display:flex;justify-content:space-between;align-items:flex-start">
        <div><div class="nm">${esc(d.name)}${d.status==='removed'?' <span class="badge-removed">removed</span>':''}</div>
        <div class="small" style="color:var(--text-2);margin-top:2px">${esc(d.state)}${d.district?' · '+esc(d.district):''}</div></div>
        <span class="badge">${d.type}</span>
      </div>
      <div class="small" style="color:var(--text-2)">${esc(d.contact_person||'—')}${d.phone?' · '+esc(d.phone):''}</div>
      <div class="small" style="color:var(--text-2)">RSM ${esc(nameOf(d.assigned_rsm))}${d.assigned_asm?' · '+esc(nameOf(d.assigned_asm)):''}</div>
      <div class="actionsrow">
        <button class="btn btn-ghost" style="background:var(--sunken)" data-hist="${d.id}">History</button>
        <button class="btn btn-ghost" data-editdealer="${d.id}">Edit</button>
      </div>
      <div id="hist-${d.id}" hidden><div class="audit" id="histbody-${d.id}">Loading…</div></div>
    </div>`).join('')||'<div class="card"><div class="empty">No dealers yet — add the first one</div></div>'}
  </div>`;
}

/* ===== Team & Incentives ===== */
function mtdWonBy(uid){
  const ms=monthStartISO();
  return cache.deals.filter(d=>d.stage==='won'&&d.owner===uid&&d.won_at&&d.won_at>=ms)
    .reduce((s,d)=>s+(+d.deal_size||0),0);
}
function slabFor(v){let s=null;for(const x of cache.slabs)if(v>=+x.threshold)s=x;return s;}
function rTeam(){
  const team=cache.profiles.filter(p=>['rsm','asm'].includes(p.role)&&p.status==='active'&&(!stateFilter||stateFilter==='__hq__'||p.state===stateFilter))
    .sort((a,b)=>(a.state||'').localeCompare(b.state||'')||a.role.localeCompare(b.role));
  const calc=p=>{
    const tgt=cache.targets.find(t=>t.user_id===p.id);
    const mtd=mtdWonBy(p.id);
    const pct=tgt&&+tgt.target_amount?Math.min(100,Math.round(mtd/+tgt.target_amount*100)):0;
    const slab=slabFor(mtd);
    const inc=slab?mtd*+slab.rate:0;
    return {tgt,mtd,pct,slab,inc};
  };
  const ratefmt=r=>(+r*100).toFixed(2).replace(/\.?0+$/,'')+'%';
  const slabsCard=`<div class="card slabcard"><h3>Incentive slabs</h3>
    <div class="sub">From the existing incentive scheme (Terranova CRM workbook, incentive-sales tab)</div>
    ${cache.slabs.map(s=>`<div class="srow"><span>Reach ${esc(s.label)} (${inr(s.threshold)})</span><span class="srate">${ratefmt(s.rate)} of sales</span></div>`).join('')}
  </div>`;
  const cards=team.map(p=>{
    const {tgt,mtd,pct,slab,inc}=calc(p);
    return `<div class="card tcard lift">
      <div class="toprow"><div><div class="nm">${esc(p.full_name)}</div>
        <div class="small muted">${ROLE_LABEL[p.role]} · ${esc(p.state||'')}</div></div>
        <span class="slabchip">${slab?esc(slab.label):'below ₹5L'}</span></div>
      <div class="nums"><span>Booked MTD <b>${inr(mtd)}</b></span><span>Target <b>${tgt?inr(tgt.target_amount):'—'}</b></span></div>
      <div class="pbar"><div style="width:0%" data-w="${pct}"></div></div>
      <div class="incrow"><span class="small" style="color:var(--text-2);font-weight:600">Incentive MTD</span>
        <span class="inc">${inr(Math.round(inc))}</span></div>
    </div>`;}).join('');
  const rows=team.map(p=>{
    const {tgt,mtd,pct,slab,inc}=calc(p);
    return `<div class="ttrow">
      <div><div style="font-weight:800">${esc(p.full_name)}</div><div class="small muted">${ROLE_LABEL[p.role]} · ${esc(p.state||'')}</div></div>
      <span class="tnum">${tgt?inr(tgt.target_amount):'—'}</span>
      <span class="tnum" style="font-weight:800">${inr(mtd)}</span>
      <div><div class="pbar" style="margin-top:0"><div style="width:0%" data-w="${pct}"></div></div><span class="small muted">${pct}%</span></div>
      <span class="small">${slab?esc(slab.label):'below ₹5L'}</span>
      <span class="tnum" style="font-weight:800;color:var(--brand-dark)">${inr(Math.round(inc))}</span>
    </div>`;}).join('');
  return `<div class="pagehead"><div><h2>Team &amp; Incentives</h2><div class="sub">Month-to-date actuals vs slab targets — visible daily, not just month-end</div></div></div>
  <div class="only-mobile"><div class="dashgrid" style="grid-template-columns:1fr">${cards||'<div class="card"><div class="empty">No team members visible</div></div>'}</div>${slabsCard}</div>
  <div class="only-desktop"><div class="card teamtable">
    <div class="tthead"><span>Member</span><span>Target (month)</span><span>Booked MTD</span><span>Progress</span><span>Slab</span><span>Incentive MTD</span></div>
    ${rows||'<div class="empty">No team members visible</div>'}
  </div>${slabsCard}</div>`;
}

/* ---------- view bindings ---------- */
function bindView(){
  $('#adddeal')&&($('#adddeal').onclick=()=>dealModal(null));
  $('#segpick')&&$('#segpick').querySelectorAll('button').forEach(b=>b.onclick=()=>{pipeSeg=b.dataset.s;render();});
  document.querySelectorAll('.kcard').forEach(c=>{
    c.onclick=e=>{
      const mv=e.target.closest('[data-mv]');
      if(mv){moveStage(c.dataset.deal,+mv.dataset.mv);return;}
      if(me.role==='admin_entry')return;
      const d=cache.deals.find(x=>x.id===c.dataset.deal); if(d)dealModal(d);
    };});
  $('#adddealer')&&($('#adddealer').onclick=()=>dealerModal(null));
  document.querySelectorAll('[data-editdealer]').forEach(b=>b.onclick=()=>{const d=cache.dealers.find(x=>x.id===b.dataset.editdealer);dealerModal(d);});
  document.querySelectorAll('[data-hist]').forEach(b=>b.onclick=()=>toggleHist(b.dataset.hist));
  $('#dq')&&($('#dq').oninput=()=>{window._dq=$('#dq').value;clearTimeout(window._dqh);window._dqh=setTimeout(()=>{render();const q=$('#dq');q&&(q.focus(),q.setSelectionRange(q.value.length,q.value.length));},300);});
  $('#showrm')&&($('#showrm').onchange=()=>{showRemoved=$('#showrm').checked;render();});
  $('#checkin')&&($('#checkin').onclick=checkin);
  $('#logvisit')&&($('#logvisit').onclick=visitModal);
  $('#addtask')&&($('#addtask').onclick=taskModal);
  document.querySelectorAll('[data-done]').forEach(b=>b.onclick=async()=>{
    const {error}=await db.from('activities').update({done:true}).eq('id',b.dataset.done);
    error?fail(error):(toast('Done ✓'),refresh());});
  // checked-in state class
  const ci=$('#checkin'); if(ci&&ci.textContent.includes('Checked in'))ci.classList.add('done');
}

async function moveStage(id,dir){
  const d=cache.deals.find(x=>x.id===id);if(!d)return;
  const i=STAGES.indexOf(d.stage)+dir;
  if(i<0||i>=STAGES.length)return;
  const {error}=await db.from('deals').update({stage:STAGES[i]}).eq('id',id);
  if(error)return fail(error);
  if(STAGES[i]==='won')toast('Deal marked as Won 🎉','win');
  else toast(`Moved to ${STAGE_LABEL[STAGES[i]]}`);
  refresh();
}
async function toggleHist(id){
  const tr=$('#hist-'+id);tr.hidden=!tr.hidden;
  if(tr.hidden)return;
  const {data,error}=await db.from('dealer_audit').select('*').eq('dealer_id',id).order('at',{ascending:false}).limit(20);
  if(error)return fail(error);
  $('#histbody-'+id).innerHTML=data.length?data.map(a=>{
    let extra='';
    if(a.action==='reassigned'&&a.detail?.from)extra=` — ${esc(a.detail.from.state||'')}${a.detail.from.district?'/'+esc(a.detail.from.district):''} → ${esc(a.detail.to.state||'')}${a.detail.to.district?'/'+esc(a.detail.to.district):''}`;
    return `<div class="arow"><span style="font-weight:600">${a.action}${extra}</span><span class="muted" style="flex-shrink:0">${esc(nameOf(a.actor))} · ${new Date(a.at).toLocaleString('en-IN',{day:'numeric',month:'short',hour:'2-digit',minute:'2-digit'})}</span></div>`;
  }).join(''):'No history';
}

/* ---------- modals ---------- */
function openModal(html){$('#modalroot').innerHTML=`<div class="modal">${html}</div>`;$('#modalroot').style.display='flex';
  $('#modalroot').onclick=e=>{if(e.target.id==='modalroot')closeModal();};}
function closeModal(){$('#modalroot').style.display='none';$('#modalroot').innerHTML='';}

function dealModal(d){
  const isNew=!d;d=d||{};
  const lockedLead=me.role==='admin_entry';
  const dealerOpts='<option value="">— none / direct —</option>'+cache.dealers.filter(x=>x.status==='active').map(x=>`<option value="${x.id}" ${d.dealer_id===x.id?'selected':''}>${esc(x.name)} (${esc(x.state)})</option>`).join('');
  const prodOpts='<option value="">—</option>'+cache.products.map(p=>`<option value="${p.id}" ${d.product_id===p.id?'selected':''}>${esc(p.category)} — ${esc(p.name)}</option>`).join('');
  const stateOpts=(isLeader()||me.role==='admin_entry')
    ?'<option value="">HQ / National</option>'+STATES.map(s=>`<option ${d.state===s?'selected':''}>${s}</option>`).join('')
    :`<option selected>${me.state}</option>`;
  const ownerOpts=cache.profiles.filter(p=>p.status==='active'&&['rsm','asm','ceo','coo','sales_head'].includes(p.role)).map(p=>`<option value="${p.id}" ${(d.owner||me.id)===p.id?'selected':''}>${esc(p.full_name)}</option>`).join('');
  openModal(`<h3>${isNew?(lockedLead?'New lead':'New deal'):'Edit deal'}</h3><div class="small muted">${isNew?'':esc(STAGE_LABEL[d.stage])}</div>
  <div class="msec"><div class="eyebrow">Deal details</div>
  <label>Opportunity / account *<input id="f_title" value="${esc(d.title||'')}" placeholder="e.g. Sunrise Electricals — 5KVA order"></label>
  <div class="mrow">
    <label>Dealer / distributor<select id="f_dealer">${dealerOpts}</select></label>
    <label>Segment<select id="f_seg"><option value="b2c" ${d.segment!=='b2b'?'selected':''}>B2C</option><option value="b2b" ${d.segment==='b2b'?'selected':''}>B2B</option></select></label>
    <label>Stage<select id="f_stage" ${lockedLead?'disabled':''}>${STAGES.map(s=>`<option value="${s}" ${(d.stage||'lead')===s?'selected':''}>${STAGE_LABEL[s]}</option>`).join('')}</select></label>
    <label>Deal size (₹)<input id="f_size" type="number" min="0" value="${d.deal_size??''}"></label>
    <label>Product<select id="f_prod">${prodOpts}</select></label>
    <label>Expected close<input id="f_close" type="date" value="${d.expected_close||''}"></label>
    <label>State<select id="f_state" ${isLeader()||me.role==='admin_entry'?'':'disabled'}>${stateOpts}</select></label>
    <label>District${me.role==='asm'?`<select id="f_dist">${(me.districts||[]).map(x=>`<option ${d.district===x?'selected':''}>${x}</option>`).join('')}</select>`:`<input id="f_dist" value="${esc(d.district||'')}" placeholder="optional">`}</label>
  </div></div>
  <div class="msec"><div class="eyebrow">Quote &amp; order <span class="hint" style="text-transform:none;letter-spacing:0">— log only, no documents in Phase 1</span></div>
  <div class="mrow">
    <label>Quote sent?<select id="f_qs"><option value="false" ${!d.quote_sent?'selected':''}>No</option><option value="true" ${d.quote_sent?'selected':''}>Yes</option></select></label>
    <label>Quote date<input id="f_qd" type="date" value="${d.quote_date||''}"></label>
    <label>Quote amount (₹)<input id="f_qa" type="number" min="0" value="${d.quote_amount??''}"></label>
    <label>Order confirmed<input id="f_oc" type="date" value="${d.order_confirmed_date||''}"></label>
    <label>Delivery expected<input id="f_dex" type="date" value="${d.delivery_expected||''}"></label>
    <label>Delivery actual<input id="f_dac" type="date" value="${d.delivery_actual||''}"></label>
  </div></div>
  <div class="msec"><div class="eyebrow">Owner &amp; notes</div>
  <label>Owner<select id="f_owner" ${isLeader()?'':'disabled'}>${ownerOpts}</select></label>
  <label>Next action<input id="f_na" value="${esc(d.next_action||'')}"></label>
  <label>Remarks / challenges<textarea id="f_rm" rows="2">${esc(d.remarks||'')}</textarea></label>
  </div>
  <div class="mfoot">${!isNew&&isLeader()?'<button class="btn btn-danger" id="f_del">Delete</button>':''}
    <span style="flex:1"></span>
    <button class="btn btn-plain" onclick="closeModal()">Cancel</button>
    <button class="btn btn-primary" id="f_save">${isNew?'Create':'Save'}</button></div>`);
  $('#f_save').onclick=async()=>{
    const v=x=>$(x).value||null;
    if(!v('#f_title'))return toast('Title is required','err');
    const payload={title:v('#f_title'),dealer_id:v('#f_dealer'),segment:$('#f_seg').value,
      stage:lockedLead?'lead':$('#f_stage').value,deal_size:v('#f_size'),product_id:v('#f_prod'),
      expected_close:v('#f_close'),state:(isLeader()||me.role==='admin_entry')?(v('#f_state')||null):me.state,
      district:v('#f_dist'),owner:isLeader()?v('#f_owner'):(d.owner||me.id),
      quote_sent:$('#f_qs').value==='true',quote_date:v('#f_qd'),quote_amount:v('#f_qa'),
      order_confirmed_date:v('#f_oc'),delivery_expected:v('#f_dex'),delivery_actual:v('#f_dac'),
      next_action:v('#f_na'),remarks:v('#f_rm')};
    const q=isNew?db.from('deals').insert(payload):db.from('deals').update(payload).eq('id',d.id);
    const {error}=await q;
    if(error)return fail(error);
    closeModal();
    if(payload.stage==='won'&&d.stage!=='won')toast('Deal marked as Won 🎉','win');
    else toast(isNew?'Deal created':'Saved');
    refresh();
  };
  $('#f_del')&&($('#f_del').onclick=async()=>{
    if(!confirm('Delete this deal permanently?'))return;
    const {error}=await db.from('deals').delete().eq('id',d.id);
    if(error)return fail(error);
    closeModal();toast('Deleted');refresh();});
}

function dealerModal(d){
  const isNew=!d;d=d||{};
  const canMoveState=isLeader(); // cross-state reassignment needs Sales Head — RLS blocks RSMs server-side too
  const stateOpts=STATES.map(s=>`<option ${(d.state||me.state)===s?'selected':''}>${s}</option>`).join('');
  const rsms=cache.profiles.filter(p=>p.role==='rsm'&&p.status==='active');
  const asms=cache.profiles.filter(p=>p.role==='asm'&&p.status==='active');
  openModal(`<h3>${isNew?'Add dealer / distributor':'Edit dealer'}</h3>
  <label>Dealer name *<input id="g_name" value="${esc(d.name||'')}"></label>
  <div class="mrow">
    <label>Type<select id="g_type"><option value="dealer" ${d.type!=='distributor'?'selected':''}>Dealer</option><option value="distributor" ${d.type==='distributor'?'selected':''}>Distributor</option></select></label>
    <label>Status<select id="g_status"><option value="active" ${d.status!=='removed'?'selected':''}>Active</option><option value="removed" ${d.status==='removed'?'selected':''}>Removed</option></select></label>
    <label>State ${canMoveState||(isNew&&me.role==='admin_entry')?'':'<span class="hint">— leadership-only</span>'}<select id="g_state" ${canMoveState||(isNew&&me.role==='admin_entry')?'':'disabled'}>${me.role==='admin_entry'&&isNew?STATES.map(s=>`<option ${(d.state)===s?'selected':''}>${s}</option>`).join(''):stateOpts}</select></label>
    <label>District${me.role==='asm'?`<select id="g_dist">${(me.districts||[]).map(x=>`<option ${d.district===x?'selected':''}>${x}</option>`).join('')}</select>`:`<input id="g_dist" value="${esc(d.district||'')}">`}</label>
    <label>Contact person<input id="g_cp" value="${esc(d.contact_person||'')}"></label>
    <label>Phone<input id="g_ph" value="${esc(d.phone||'')}"></label>
    <label>Credit limit (₹) <span class="hint">(placeholder)</span><input id="g_cl" type="number" min="0" value="${d.credit_limit??''}"></label>
    <label>Payment terms <span class="hint">(placeholder)</span><input id="g_pt" value="${esc(d.payment_terms||'')}"></label>
    <label>Assigned RSM<select id="g_rsm"><option value="">—</option>${rsms.map(p=>`<option value="${p.id}" ${(d.assigned_rsm||((me.role==='rsm')?me.id:''))===p.id?'selected':''}>${esc(p.full_name)} (${esc(p.state)})</option>`).join('')}</select></label>
    <label>Assigned ASM<select id="g_asm"><option value="">—</option>${asms.map(p=>`<option value="${p.id}" ${(d.assigned_asm||((me.role==='asm')?me.id:''))===p.id?'selected':''}>${esc(p.full_name)} (${esc(p.state)})</option>`).join('')}</select></label>
  </div>
  <div class="mfoot">
    ${!isNew&&d.status==='active'?'<button class="btn btn-danger" id="g_rm">Remove</button>':''}
    <span style="flex:1"></span>
    <button class="btn btn-plain" onclick="closeModal()">Cancel</button>
    <button class="btn btn-primary" id="g_save">${isNew?'Add dealer':'Save dealer'}</button></div>`);
  $('#g_save').onclick=async()=>{
    const v=x=>$(x).value||null;
    if(!v('#g_name'))return toast('Name is required','err');
    const payload={name:v('#g_name'),type:$('#g_type').value,status:$('#g_status').value,
      state:$('#g_state').value,district:v('#g_dist'),contact_person:v('#g_cp'),phone:v('#g_ph'),
      credit_limit:v('#g_cl'),payment_terms:v('#g_pt'),assigned_rsm:v('#g_rsm'),assigned_asm:v('#g_asm')};
    const q=isNew?db.from('dealers').insert(payload):db.from('dealers').update(payload).eq('id',d.id);
    const {error}=await q;
    if(error)return fail(error.message?.includes('row-level security')?{message:'Not allowed — this change crosses your territory boundary.'}:error);
    closeModal();toast(isNew?'Dealer added':'Saved');refresh();
  };
  $('#g_rm')&&($('#g_rm').onclick=async()=>{
    if(!confirm('Remove this dealer? History is kept and it can be restored.'))return;
    const {error}=await db.from('dealers').update({status:'removed'}).eq('id',d.id);
    if(error)return fail(error);
    closeModal();toast('Dealer removed');refresh();});
}

function taskModal(){
  openModal(`<h3>New task</h3>
  <label>What *<input id="t_title" placeholder="e.g. Call Sunrise Electricals re: quote"></label>
  <div class="mrow">
    <label>Type<select id="t_type"><option value="task">Task</option><option value="call">Call</option><option value="visit">Visit</option></select></label>
    <label>Due date<input id="t_due" type="date" value="${todayISO()}"></label>
  </div>
  <label>Dealer (optional)<select id="t_dealer"><option value="">—</option>${cache.dealers.filter(x=>x.status==='active').map(x=>`<option value="${x.id}">${esc(x.name)}</option>`).join('')}</select></label>
  <div class="mfoot"><button class="btn btn-plain" onclick="closeModal()">Cancel</button>
  <button class="btn btn-primary" id="t_save">Add</button></div>`);
  $('#t_save').onclick=async()=>{
    if(!$('#t_title').value)return toast('Title is required','err');
    const {error}=await db.from('activities').insert({type:$('#t_type').value,title:$('#t_title').value,
      due_date:$('#t_due').value||null,dealer_id:$('#t_dealer').value||null,user_id:me.id});
    if(error)return fail(error);
    closeModal();toast('Task added');refresh();};
}

function visitModal(){
  openModal(`<h3>Log a visit</h3><div class="small muted">Quick field entry — same record as Pipeline, abbreviated</div>
  <label>Dealer *<select id="v_dealer"><option value="">— choose —</option>${cache.dealers.filter(x=>x.status==='active').map(x=>`<option value="${x.id}">${esc(x.name)}${x.district?' ('+esc(x.district)+')':''}</option>`).join('')}</select></label>
  <label>Visit notes *<textarea id="v_notes" rows="3" placeholder="Who you met, what was discussed, stock situation…"></textarea></label>
  <label>Linked deal (optional)<select id="v_deal"><option value="">—</option>${cache.deals.filter(d=>!['won','lost'].includes(d.stage)).map(d=>`<option value="${d.id}">${esc(d.title)}</option>`).join('')}</select></label>
  <label>Next action for that deal<input id="v_na" placeholder="e.g. Send revised quote by Friday"></label>
  <div class="mfoot"><button class="btn btn-plain" onclick="closeModal()">Cancel</button>
  <button class="btn btn-primary" id="v_save">Log visit</button></div>`);
  $('#v_save').onclick=async()=>{
    if(!$('#v_dealer').value)return toast('Pick the dealer you visited','err');
    if(!$('#v_notes').value)return toast('Add a short note','err');
    const {error}=await db.from('activities').insert({type:'visit',title:'Visit logged',done:true,
      dealer_id:$('#v_dealer').value,notes:$('#v_notes').value,user_id:me.id,due_date:todayISO()});
    if(error)return fail(error);
    if($('#v_deal').value&&$('#v_na').value){
      const {error:e2}=await db.from('deals').update({next_action:$('#v_na').value}).eq('id',$('#v_deal').value);
      if(e2)fail(e2);
    }
    closeModal();toast('Visit logged ✓');refresh();};
}

function checkin(){
  if($('#checkin').classList.contains('done'))return;
  if(!navigator.geolocation)return toast('Location not available on this device','err');
  toast('Getting your location…');
  navigator.geolocation.getCurrentPosition(async pos=>{
    const {error}=await db.from('activities').insert({type:'check_in',title:'Check-in',done:true,user_id:me.id,
      gps_lat:pos.coords.latitude,gps_lng:pos.coords.longitude,due_date:todayISO(),
      notes:`±${Math.round(pos.coords.accuracy)}m`});
    error?fail(error):(toast('Checked in ✓','win'),refresh());
  },err=>toast('Could not get location: '+err.message,'err'),{enableHighAccuracy:true,timeout:12000});
}

/* ---------- start ---------- */
if('serviceWorker' in navigator){try{navigator.serviceWorker.register('./sw.js');}catch(e){}}
db.auth.onAuthStateChange((ev)=>{if(ev==='SIGNED_OUT'){me=null;}});
boot();
</script>
